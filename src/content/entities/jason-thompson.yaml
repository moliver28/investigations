profile: "## 0. Why this person or group is on the map\n- **Inclusion rule:** Jason Thompson holds an office and is well-connected. He sits on the MultiCare Health System Board of Directors (since January 2025). MultiCare is Pierce County's largest health system. He also holds a senior job at Russell Investments (Seattle HQ, $401B AUM), a major financial firm. He led the deal that brought Overlake and MultiCare together. That ties finance and health care across the region. (Sources 1, 2, 4)\n- **Adjacent but EXCLUDED candidates:** Other MultiCare board members (Florence Chang, Russell Stockdale, Janine Terrano) are profiled separately or ranked lower. Overlake Medical Center leaders are now part of MultiCare.\n\n## 1. Who they are\n- **Legal name:** Jason R. Thompson\n- **DOB/birthplace:** UNVERIFIED — not publicly disclosed in available sources.\n- **Current residence:** Bellevue, Washington area (inferred from Overlake and Seattle ties; LinkedIn lists Bellevue, WA). (Source 5) — INFERENCE\n- **Education:** UNVERIFIED — not disclosed in available official bios.\n- **Family/spouse:** UNVERIFIED — not publicly disclosed.\n- **Career:** Joined Russell Investments in 1994. He has worked there 30+ years. He is now Director for the firm's Americas Institutional business. He previously served on the Overlake Medical Center Foundation board (6 years, 2 years as chair). He then became Chair of Overlake Medical Center & Clinics Board of Trustees. He joined the MultiCare Board in January 2025 after the Overlake-MultiCare deal closed. (Sources 1, 2, 3)\n\n## 3. Where their power comes from\n- **Institutional role:** MultiCare Board of Directors member (since Jan 2025). MultiCare is Washington's largest community-based, locally governed health system — 13+ hospitals, $6.1B annual revenue, based in Tacoma. (Sources 1, 7)\n- **Corporate role:** Director, Americas Institutional business, Russell Investments — a $401B AUM global investment firm based in Seattle. (Sources 1, 6)\n- **Prior governance power:** Chair of Overlake Medical Center & Clinics Board of Trustees. He led the affiliation talks with MultiCare (signed May 2024, closed Oct 2024). Overlake became MultiCare's North Sound region flagship. (Sources 3, 4)\n- **Domain overlaps:** Institutional (MultiCare board) + Finance (Russell Investments) + Health care governance (Overlake, MultiCare).\n\n## 3. Where their power comes from\n| Indicator | Finding | Evidence (source #) |\n|-----------|---------|---------------------|\n| Who benefits | MultiCare gains Overlake's Eastside market. Russell Investments benefits from Thompson's board network. | 1, 4 |\n| Who sits | MultiCare Board of Directors; Russell Investments senior leadership; former Overlake Board Chair. | 1, 2, 3 |\n| Who governs | Board votes on MultiCare strategic, financial, and clinical decisions. Oversaw the Overlake affiliation. | 3, 4 |\n| Who wins | Engineered the Overlake-MultiCare affiliation — expanded MultiCare's statewide reach. | 3, 4 |\n\n## 5. How they touch government\n- **Campaign donations:** UNVERIFIED. No WA Public Disclosure Commission (PDC) or FEC records were found for Jason R. Thompson in available searches. This may be a common-name issue.\n- **Lobbying:** No direct lobbying found. Russell Investments may lobby on financial industry issues, but Thompson's job is client-facing, not lobbying. UNVERIFIED.\n- **Regulatory interactions:** As a MultiCare board member, he oversees an institution subject to the WA State Health Care Authority, the Centers for Medicare & Medicaid Services (CMS), and the Joint Commission. He has no direct regulatory role.\n\n## 6. Other seats they hold\n- **MultiCare Health System:** Board of Directors (since January 2025). (Sources 1, 2)\n- **Russell Investments:** 30+ year career. Director, Americas Institutional business. Russell HQ: 401 Union St, Seattle. $401B AUM. (Sources 1, 6)\n- **Overlake Medical Center & Clinics:** Former Board Chair; former Foundation Board Chair (6 years). Led the Overlake-MultiCare affiliation (May 2024). (Sources 3, 4)\n- **Overlake Foundation:** Former board member and chair. (Source 3)\n\n## 9. Who they are connected to\n- Graph connections (from `evidence/29-power-graph-v2.json`):\n\n| Connected entity | Relationship | Weight |\n|---|---|---|\n| MultiCare Health (`multicare`) | board | 4 |\n| Russell Investments (`russell-invest`) | director | 4 |\n\n- \n\n`jason-thompson`, target=`overlake`, relationship=board_chair, weight=4, note=\"https://www.overlakehospital.org/about/leadership/thompson-jason\".\n`jason-thompson`, target=`multicare`, relationship=affiliation_architect, weight=4, note=\"https://www.multicare.org/newsroom/2024/05/overlake-and-multicare-sign-affiliation-agreement\".\n\n## 1. Who they are\n| # | Claim | Source | URL | Type (primary/secondary) | Reliability |\n|---|-------|--------|-----|--------------------------|-------------|\n| 1 | MultiCare board member since Jan 2025; Russell Investments 30+ years; Director Americas Institutional | MultiCare official Board of Directors page | https://www.multicare.org/about/leadership/board-directors | primary | 1.0 |\n| 2 | MultiCare board appointment details, bio summary | Oregon.gov Form A exhibit (MultiCare Board PDF) | https://www.oregon.gov/oha/HPA/HP/Form%20A%20Page%20Docs/FA-03%20Exhibit%203.a.i%20-%20PUBLIC%20MultiCare%20Board%20of%20Directors.pdf | primary | 0.95 |\n| 3 | Overlake board chair, Foundation board (6 years, 2 as chair), Russell since 1994 | Overlake Medical Center official bio | https://www.overlakehospital.org/about/leadership/thompson-jason | primary | 1.0 |\n| 4 | Overlake-MultiCare affiliation statement by Thompson as Board Chair | MultiCare Newsroom / PRNewswire | https://www.multicare.org/newsroom/2024/05/overlake-and-multicare-sign-affiliation-agreement | primary | 1.0 |\n| 5 | Bellevue, WA residence (LinkedIn) | LinkedIn profile | https://www.linkedin.com/in/thompson1 | secondary | 0.60 |\n| 6 | Russell Investments $401B AUM, Seattle HQ, TA Associates majority ownership | LinkedIn company page | https://www.linkedin.com/company/russell-investments | secondary | 0.85 |\n| 7 | MultiCare $6.1B revenue, 13+ hospitals, Tacoma HQ, largest WA community health system | LeadNear company profile | https://www.leadnear.com/company/us/multicare-health-system | secondary | 0.80 |\n\n## 1. Who they are\n- **Verdict:** Jason Thompson holds power across different fields at once. He sits on the MultiCare board, holds a senior director job at Russell Investments, and was formerly the Overlake Board Chair. He personally designed the Overlake-MultiCare deal, which expanded Pierce County's largest health system into the Eastside market. His power is institutional. It comes from board authority over a $6.1B health system and a senior role at a $401B AUM investment firm.\n- **Conflicts-of-interest flags:** Holding both a Russell Investments job (finance) and a MultiCare board seat (health care) could create conflicts. No specific conflict has been identified. His role in the Overlake-MultiCare deal could boost his own standing.\n- **Analysis of alternatives:** An opposing reading would note that Thompson is one of many MultiCare board members without an executive role. His power may be limited to board votes, with no operational control. His Russell Investments role is as a director (client-facing), not a C-suite executive. That may limit his independent power inside that firm. Personal details (education, date of birth, family) are mostly UNVERIFIED.\n- **Confidence:** Medium — strong primary sources for board roles and the affiliation, but big gaps in personal details, campaign finance activity, and education. The common name creates a disambiguation risk."
