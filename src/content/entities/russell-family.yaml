profile: "## 0. Why this person or group is on the map\n- The Russell Family Foundation (TRFF) is one of the biggest family foundations in Pierce County. It is based in Gig Harbor. It was set up in 1999 with money from the sale of the Frank Russell Company to Northwestern Mutual Life. George F. Russell Jr. and Jane Russell started it.\n- It has $77.3 million in assets. In 2023, it gave out 124 grants worth $1.24 million. It has given about $41 million over its life. Most of its money (90%) goes to \"impact-aligned\" investments: climate, forests, renewable power, and affordable housing.\n- TRFF runs Jane's Fellowship Program. It trains Pierce County residents to be civic leaders. Since 2004, 159 people have gone through the program.\n\n## 1. Who they are\n- **Full legal name:** The Russell Family Foundation (TRFF).\n- **Type:** Private family foundation. It is a 501(c)(3) tax-exempt nonprofit. Founded 1999.\n- **Federal tax ID (EIN):** 91-1663336.\n- **Office address:** 3025 Harborview Drive, Gig Harbor, WA 98335.\n- **Founders:** George F. Russell Jr. and Jane T. Russell.\n- **Parent or subsidiaries:** None. Russell Investments is a separate company. It is not part of TRFF.\n- **Who governs it:** Washington State nonprofit law (state law (RCW) 24.03). It also has a 501(c)(3) tax exemption from the federal tax agency (IRS).\n- **CEO:** Kathleen Simpson.\n- **Board:** Sarah Cavanaugh (President), Tim Cavanaugh (Treasurer), Mimi Chau (Vice President), Dion Rurik (Secretary), Josh Cavanaugh (Investment & Audit Committee Chair), plus Evlyn Andrade, Sarah Cleveland, and Rashad Morris. Many board members are part of the Russell family.\n\n## 3. Where their power comes from\n- **Philanthropic power:** TRFF uses 90% of its investments to back causes it cares about: climate, sustainable forestry, clean energy, and affordable housing. It runs four programs: Catalytic Climate Finance, Environmental Education, Food for Climate Solutions, and Jane's Fellowship Program.\n- **Grantmaking scale:** $1.24 million across 124 grants in 2023. About $41 million over its life across 800 plus grants. In April 2024, it gave $819,000 to 27 groups for youth outdoor education. In April 2026, it announced $2.3 million in environmental education and food-for-climate grants. In Feb 2025, it announced $19.5 million in catalytic climate finance grants and investments.\n- **Leadership pipeline:** Jane's Fellowship Program (JFP) started in 2004 to honor Jane Russell. Each year, up to 15 grassroots leaders join. Fellows must be 24 or older and live in Pierce County. Each fellow gets $8,500 plus up to $2,500 for coaching and training. 159 leaders have graduated since 2004 across 13 classes.\n- **No government funding:** TRFF gets no government money. It is fully funded by the Russell family endowment.\n- **Leadership training:** JFP picks Pierce County grassroots leaders and trains them for civic leadership roles.\n\n## 3. Where their power comes from\n| Question | Answer |\n|----------|--------|\n| Who benefits | 124 Pierce County and Western Washington nonprofits got grants in 2023 ($1.24 million). 159 leaders graduated from JFP since 2004. Climate groups get $19.5 million in catalytic capital. |\n| Who sits | Russell family board: Sarah Cavanaugh (President), Tim Cavanaugh (Treasurer), Mimi Chau (VP), Dion Rurik (Secretary), Josh Cavanaugh (I&A Chair), plus Andrade, Cleveland, Morris; CEO Kathleen Simpson. |\n| Who governs | Family controls the board. Russell family grants shape Pierce County climate, education, and leadership efforts. |\n| Who wins | Pierce County nonprofits. JFP graduates run many local nonprofits. TRFF's climate money shapes regional food systems (Pierce County Fresh, Food For Climate Solutions). |\n\n## 9. Who they are connected to\n- Graph connections (from `evidence/29-power-graph-v2.json`):\n\n| Connected entity | Relationship | Weight |\n|---|---|---|\n| Russell Investments (`russell-invest`) | founded_by | 5 |\n| Museum of Glass (`museum-of-glass`) | legacy | 4 |\n\n- \n`russell-family`, target=`russell-invest`, relationship=funded_by_proceeds_of_sale, weight=5, note=\"https://www.seattletimes.com/business/local-business/george-f-russell-jr-93-turned-family-firm-into-investing-giant-dies\".\n`russell-family`, target=`museum-of-glass`, relationship=co_founded_2002, weight=4, note=\"https://www.seattletimes.com/business/local-business/george-f-russell-jr-93-turned-family-firm-into-investing-giant-dies\".\n`russell-family`, target=`community-boat-project`, relationship=funder, weight=3, note=\"https://trff.org/about/our-story\".\n`russell-family`, target=`puyallup-watershed-initiative`, relationship=incubated_to_independence, weight=3, note=\"https://trff.org/about/our-story\".\n\n## 1. Who they are\n| # | Claim | Source | URL | Type (primary/secondary) | Reliability |\n|---|-------|--------|-----|--------------------------|-------------|\n| 1 | George F. Russell Jr. obituary: died Dec 18, 2025 at 93; co-founded The Russell Family Foundation with Jane in 1999 using sale proceeds of Frank Russell Company to Northwestern Mutual Life; co-founded Museum of Glass (2002, Tacoma); co-founded WHOI/Woods Hole trustee | Woods Hole Oceanographic Institution obituary | https://www.whoi.edu/who-we-are/about-us/people/obituary/george-f-russell-jr | primary | 1.0 |\n| 2 | George F. Russell Jr. obituary — same foundation founding facts, Museum of Glass opening 2002, wife Jane died 2002 age 67 from cancer, Russell remarried Dion Peterson 2003, eldest son Richard predeceased | Seattle Times | https://www.seattletimes.com/business/local-business/george-f-russell-jr-93-turned-family-firm-into-investing-giant-dies | secondary | 0.95 |\n| 3 | TRFF history: founded 1999 with proceeds of Frank Russell Co. sale; Jane's Fellowship Program launched 2004; 144 graduates across 12 classes; TRFF reaches 90% impact-aligned investments; 2020 COVID $1.82M to 87 organizations; 50% asset transition; PWI spun off | TRFF Our Story (official) | https://trff.org/about/our-story | primary | 1.0 |\n| 4 | Jane's Fellowship Program: 12-month leadership program, 24+ years old, Pierce County residents, $8,500 stipend + $2,500 training/coaching; 144 graduates since 2004; Class 13 announced 2025 | TRFF Jane's Fellowship official page | https://trff.org/programs/janes-fellowship | primary | 1.0 |\n| 5 | TRFF quick stats: $1,237,599 annual giving (2023), $77.3M total assets, $3K-$600K grant range, 124 grants in 2023, Western WA / Pierce County focus, EIN 91-1663336, 3025 Harborview Dr Gig Harbor | Hinchilla (public funder directory cross-referencing IRS data) | https://www.hinchilla.com/funders-us/911663336-the-russell-family-foundation | secondary | 0.85 |\n| 6 | TRFF staff + board roster: CEO Kathleen Simpson; President Sarah Cavanaugh, Treasurer Tim Cavanaugh, VP Mimi Chau, Secretary Dion Rurik, I&A Chair Josh Cavanaugh, plus Andrade, Cleveland, Morris | TRFF Our People (official) | https://trff.org/about/our-people | primary | 1.0 |\n| 7 | Jane's Fellowship Class 13 accepting applications Sept 2025; stipends $8,500 + $2,500; 144 fellows on record | TRFF News (JFP Class 13 announcement) | https://trff.org/updates/janes-fellowship-program-now-accepting-applicants-for-class-13 | primary | 1.0 |\n\n## 1. Who they are\n- **Verdict:** The Russell Family Foundation sets the agenda in Pierce County on climate, environmental education, food systems, and grassroots leadership. It is funded by a $77.3 million endowment from the 1999 sale of Frank Russell Company. Its 159-strong Jane's Fellowship alumni network is a major leadership pipeline. With 90% impact-aligned investments and $19.5 million in catalytic climate finance, TRFF shapes how climate money gets spent in the region.\n- **Conflicts-of-interest flags:** TRFF's board is mostly Russell family members and their relatives (Cavanaugh and Rurik surnames). Many generations sit on the board. That means one family controls decisions with little outside input. The foundation does not have to report political spending like a political group. Some JFP alumni have moved into political and advocacy roles.\n- **Analysis of alternatives :** A defense view: TRFF is small compared to giant foundations like the Gates Foundation. Its grants are modest. JFP is not coercive. An opposing view: A 25-year-old family-controlled foundation with a 159-strong alumni network shapes who gets heard in Pierce County civic life. It is a textbook case of soft power through nonprofit channels.\n- **Confidence:** High — primary-source confirmation via TRFF's official website (history, programs, people), WHOI obituary, Seattle Times coverage, and Jane's Fellowship cohort data."
