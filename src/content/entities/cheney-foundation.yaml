profile: "## §0 why this entity is on the map\nThe Cheney Foundation is one of the largest private family foundations in Pierce County. It gives grants across youth, education, community development, and human services. These areas overlap with many public agencies and nonprofits in the network.\n\n## §1 who they are legally\n**FACT** The Ben B. Cheney Foundation Inc. was incorporated in 1955 in Washington. It is a family foundation.\n**Source:** https://fconline.foundationcenter.org/fdo-grantmaker-profile?key=CHEN001 (primary; reliability 0.85)\n\n**FACT** Foundation EIN: 91-6053760. Location: 3110 Ruston Way Ste A, Tacoma, WA 98402-5308.\n**Source:** https://fconline.foundationcenter.org/fdo-grantmaker-profile?key=CHEN001 (primary; reliability 0.85).\n\n**FACT** Ben B. Cheney founded the Cheney Lumber Company in 1936. He worked in the lumber industry his whole life. After he died in 1971, his estate set up the Foundation. It began giving grants in 1975.\n**Source:** https://fconline.foundationcenter.org/fdo-grantmaker-profile?key=CHEN001 (primary; reliability 0.85).\n\n## §2 Governance\n**FACT** Current board of directors (per official Foundation page):\n- Bradbury Cheney, Board Chair\n- Carolyn Cheney, Vice Chair\n- Jordan Beckingham, Secretary\n- Matt Beckingham, Treasurer\n- Andrew Cheney\n- Henry Cheney\n- Mallory Delebar\n- Bob Hall\n**Source:** https://www.benbcheneyfoundation.org/about/board-staff (primary; reliability 0.95)\n\n**FACT** Staff: Erika Tucci (Executive Director), Jenette Warne (Program Officer), Mary McCune (Executive Administrative Assistant).\n**Source:** https://www.benbcheneyfoundation.org/about/board-staff (primary; reliability 0.95).\n\n**FACT** The Foundation runs eight grant areas. They include charity programs, youth, education, and community development.\n**Source:** https://fconline.foundationcenter.org/fdo-grantmaker-profile?key=CHEN001 (primary; reliability 0.85).\n\n## §3a what they influence \n| Indicator | Evidence |\n|---|---|\n| **Who benefits** | Grantees in Pierce County — youth, education, mental health, and community nonprofits. One example: Al Davies Boys & Girls Clubs Teen Center upgrade. |\n| **Who sits** | The board is made up of Cheney family members from several generations plus non-family members like Bob Hall. Brad Cheney also serves on the Boys & Girls Club of South Puget Sound board. |\n| **Who governs** | The board sets grantmaking priorities. The Executive Director carries them out. |\n| **Who wins** | Pierce County nonprofits that fit the Foundation's eight areas. |\n\n## §4 Money\n**INFERENCE** The Foundation likely gives out millions in grants each year. Exact asset and payout figures were not confirmed from IRS Form 990 in this research cycle.\n**Source:** https://fconline.foundationcenter.org/fdo-grantmaker-profile?key=CHEN001 (primary; reliability 0.85) — note this does not list dollar amounts\n\n## §7 who they are connected to\nThe Cheney Foundation connects three areas: **philanthropy** (family foundation world), **civic nonprofits** (grant recipients), and the **Chamber** (the Foundation is a Chamber member). Its grant footprint touches many of the institutions in this network.\n\n## §10 Sources\n| # | Claim | Source | URL | Type | Reliability |\n|---|---|---|---|---|---|\n| 1 | EIN 91-6053760; incorporated 1955 WA; family foundation | Foundation Directory Online | https://fconline.foundationcenter.org/fdo-grantmaker-profile?key=CHEN001 | primary | 0.85 |\n| 2 | Endowed after Ben B. Cheney's death 1971; active since 1975 | Foundation Directory Online | https://fconline.foundationcenter.org/fdo-grantmaker-profile?key=CHEN001 | primary | 0.85 |\n| 3 | Board of Directors roster | Cheney Foundation official | https://www.benbcheneyfoundation.org/about/board-staff | primary | 0.95 |\n| 4 | Staff: Erika Tucci ED, Jenette Warne PO, Mary McCune AA | Cheney Foundation official | https://www.benbcheneyfoundation.org/about/board-staff | primary | 0.95 |\n| 5 | Tacoma-Pierce County Chamber member listing | Tacoma-Pierce County Chamber | https://business.tacomachamber.org/list/member/ben-b-cheney-foundation-12500 | primary | 0.9 |\n\n## §11 New relationships discovered\nerika-tucci, target=cheney-foundation, relationship=employs, weight=1, note=\"https://www.benbcheneyfoundation.org/about/board-staff\"\n\n## §12 Assessment\n**Confidence:** High (multiple primary sources: Foundation Directory Online + Foundation's own board page + Chamber listing).\n**Defense counter-argument:** A defense could say a single family foundation has limited reach. That is partly true. But the Cheney Foundation has a multi-generational board, 50 years of grantmaking, and Chamber membership. That gives it lasting power to set the agenda in Pierce County civic life.\n**Analysis of alternatives:** None warranted — facts are public and uncontested.\n\n**Status:** ✅ researched — 2026-09-19 — tier3-chunk11-rescue."
