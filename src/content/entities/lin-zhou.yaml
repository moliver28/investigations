profile: "## §0 why this entity is on the map\nZhou leads one of two major Tacoma technical colleges. She also serves on state boards that shape policy on college readiness and adult education.\n\n## §1 Identity\n**FACT** Dr. Lin Zhou, Ph.D., became president of Bates Technical College in 2018. She is the first female president in Bates history. She is also the first Chinese immigrant to lead a U.S. community college.\n**Source:** https://www.aacc.nche.edu/about-us/governance/2023-board-slate-profiles/lin-zhou (primary; reliability 0.9)\n\n**FACT** Bates hired Zhou in 2013 as the dean of continuing education, apprenticeship, and child studies. She then moved up. She served as dean of instruction, executive dean, and vice president of student success (2016) before her 2018 appointment.\n**Source:** https://www.batestech.edu/bates-president-lin-zhou-wins-chief-executive-officer-award (primary; reliability 0.95).\n\n**FACT** In April 2019, the College Spark Washington Board of Trustees appointed Zhou to a 14-member board. It brings together business, industry, and education leaders.\n**Source:** https://www.batestech.edu/bates-technical-colleges-president-lin-zhou-joins-college-spark-board (primary; reliability 0.95).\n\n**FACT** Governor Jay Inslee appointed Zhou to the Adult Education Advisory Council.\n**Source:** https://www.batestech.edu/governor-jay-inslee-appoints-bates-technical-college-president-lin-zhou-to-adult-education-advisory-council (primary; reliability 0.95).\n\n**FACT** Zhou received the 2023 Chief Executive Officer of the Year Award from the Washington Association of College Trustees (ACT).\n**Source:** https://www.batestech.edu/bates-president-lin-zhou-wins-chief-executive-officer-award (primary; reliability 0.95).\n\n## §2 Power basis\n**FACT** As Bates president, Zhou leads a public technical college. It runs within the State Board for Community and Technical Colleges system. Bates was founded in 1940. Its name honors director LaVerne Hazen Bates (served 1944–1969).\n**Source:** https://en.wikipedia.org/wiki/Bates_Technical_College (secondary; reliability 0.85)\n\n**FACT** Bates owns KBTC-TV (PBS Tacoma). Zhou sits on its board.\n**Source:** https://www.kbtc.org/connect/board (primary; reliability 0.9).\n\n## §3a what they influence \n| Indicator | Evidence |\n|---|---|\n| **Who benefits** | Bates students (about 3,000–4,000 each year) and apprenticeship-employer partners in Pierce County. |\n| **Who sits** | Zhou sits on the College Spark Washington board and the Governor's Adult Education Advisory Council. Both are state policy bodies. |\n| **Who governs** | A five-member board appointed by the governor governs Bates. Zhou runs their policy. |\n| **Who wins** | Workforce-development groups — apprenticeship programs and technical-employer partners. They gain from Bates's priorities. |\n\n## §7 who they are connected to\nZhou bridges three areas: **education** (Bates Technical College, KBTC-TV), **state policy** (Adult Education Advisory Council, College Spark Washington), and **workforce development** (apprenticeship programs). She is one of the few Asian American and Pacific Islander (AAPI) female college presidents in Washington.\n\n## §10 Sources\n| # | Claim | Source | URL | Type | Reliability |\n|---|---|---|---|---|---|\n| 1 | First female + Chinese immigrant president, Bates TC (2018) | American Association of Community Colleges | https://www.aacc.nche.edu/about-us/governance/2023-board-slate-profiles/lin-zhou | primary | 0.9 |\n| 2 | 2013 hire, internal promotion path, 2018 appointment | Bates Technical College news | https://www.batestech.edu/bates-president-lin-zhou-wins-chief-executive-officer-award | primary | 0.95 |\n| 3 | College Spark Washington board (April 2019) | Bates Technical College news | https://www.batestech.edu/bates-technical-colleges-president-lin-zhou-joins-college-spark-board | primary | 0.95 |\n| 4 | Inslee appointee, Adult Education Advisory Council | Bates Technical College news | https://www.batestech.edu/governor-jay-inslee-appoints-bates-technical-college-president-lin-zhou-to-adult-education-advisory-council | primary | 0.95 |\n| 5 | 2023 ACT CEO of the Year award | Bates Technical College news | https://www.batestech.edu/bates-president-lin-zhou-wins-chief-executive-officer-award | primary | 0.95 |\n\n## §11 New relationships discovered\nlin-zhou, target=bates-tech, relationship=employs, weight=1, note=\"https://www.aacc.nche.edu/about-us/governance/2023-board-slate-profiles/lin-zhou\"\nbates-tech, target=kbtc, relationship=governs, weight=1, note=\"https://www.kbtc.org/connect/board\"\n\n## §12 Assessment\n**Confidence:** High (multiple Bates-official primary sources + AACC national profile).\n**Defense counter-argument:** A defense could say a technical-college president's power is limited by state-system rules. That is true on paper. But the Bates presidency includes direct board service on two state-level policy bodies (College Spark, Adult Education Advisory Council). There, she shapes college-readiness and adult-ed priorities across Washington.\n**Analysis of alternatives:** None warranted — facts are publicly confirmed.\n\n**Status:** ✅ researched — 2026-09-19 — tier3-chunk11-rescue."
