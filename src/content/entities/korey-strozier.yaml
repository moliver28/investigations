profile: "## §0 why this entity is on the map\nStrozier is on this map because he is the elected President of the Tacoma Public Schools (TPS) Board of Directors. He holds Position 3 on the five-member board.\n\nThe board runs Tacoma Public Schools. TPS is the second-largest school district in Pierce County. About 28,272 students attended TPS during the 2024 school year.\n\nStrozier worked for TPS from 2008 to 2017. Those nine years inside the district give him strong ties to TPS staff. He now also holds an elected board seat.\n\n## §1 Identity\n**FACT** Korey Strozier is the President of the Tacoma Public Schools (TPS) Board of Directors. He represents Position 3. His current term ends in November 2029.\n**Source:** https://www.tacomaschools.org/about/school-board/board-members (primary; reliability 0.95); corroborated by Ballotpedia: https://ballotpedia.org/Tacoma_Public_Schools,_Washington,_elections (primary; reliability 0.9)\n\n**FACT** Strozier joined the board by appointment in November 2020, during the pandemic. Voters then elected him in November 2021. They elected him again in November 2023. The board picked him as President for the 2024–25 and 2025–26 school years.\n**Source:** https://www.tacomaschools.org/about/school-board/board-members (primary; reliability 0.95); https://tacomaweekly.com/tacoma-public-schools-has-much-to-celebrate-p8958-117.htm (secondary; reliability 0.85); https://www.cwu.edu/about/media-resources/news/2025/04/cwu-alum-elected-president-of-tacoma-public-schools-board-of-directors (secondary; reliability 0.85).\n\n**FACT** Strozier is a TPS graduate of Lincoln High School. He earned an associate's degree at Pierce College. He earned a bachelor's at Central Washington University. He holds a master's in leadership from City University. He is now working on a doctorate in educational leadership.\n**Source:** https://www.tacomaschools.org/about/school-board/board-members (primary; reliability 0.95); https://www.cwu.edu/about/media-resources/news/2025/04/cwu-alum-elected-president-of-tacoma-public-schools-board-of-directors (secondary; reliability 0.85).\n\n**FACT** From 2008 to 2017, Strozier worked for Tacoma Public Schools. He held hourly, classified, and certificated roles. His jobs included coach, education support specialist, case manager, graduation specialist, and athletic director.\n**Source:** https://www.tacomaschools.org/about/school-board/board-members (primary; reliability 0.95).\n\n**FACT** Outside the board, he is a founding coach with Success Cohorts. That program helps early-career professionals build leadership skills.\n**Source:** https://www.cwu.edu/about/media-resources/news/2025/04/cwu-alum-elected-president-of-tacoma-public-schools-board-of-directors (secondary; reliability 0.85).\n\n## §2 Power basis\n**FACT** As Board President, Strozier sets the meeting agenda and runs each meeting. He is the public face of the five-member elected board. The board oversees the superintendent, sets policy, and approves the district budget. The district serves about 28,272 students across 69 schools.\n**Source:** https://www.tacomaschools.org/about/school-board/board-members (primary; reliability 0.95); https://ballotpedia.org/Tacoma_Public_Schools,_Washington,_elections (primary; reliability 0.9)\n\n**FACT** Voters elect Strozier to the at-large Position 3 seat. His current term ends in November 2029.\n**Source:** https://ballotpedia.org/Tacoma_Public_Schools,_Washington,_elections (primary; reliability 0.9).\n\n## §3a what they influence \n| Indicator | Evidence |\n|---|---|\n| **Who benefits** | The board as a whole serves TPS students, district staff, and families with policy concerns before the board. The president role concentrates agenda-setting power. |\n| **Who sits** | Strozier sits at the head of the TPS board. He faces the superintendent, district staff, and the public across the table. |\n| **Who governs** | The board governs policy, approves the budget, and oversees the superintendent. The president runs the meetings and shapes the agenda. |\n| **Who wins** | When the board acts on his priorities, those win. When he is outvoted, he loses. Power is bounded by the four other elected directors. |\n\n## §7 who they are connected to\nStrozier is a recent insider turned board leader. His nine years as TPS staff (2008–2017) gave him strong ties inside the district. His current board role gives him standing outside it.\n\nAs Board President, he works with the Joint Municipal Action Committee (JMAC). JMAC pulls together Tacoma Public Schools, Tacoma City Council, Pierce County Council, Metro Parks Tacoma, the Puyallup Tribe, Port of Tacoma, Pierce Transit, and the Health Department. (Per Elizabeth Bonbright's bio on the same TPS board page.)\n\n## §10 Sources\n| # | Claim | Source | URL | Type | Reliability |\n|---|---|---|---|---|---|\n| 1 | TPS Board of Directors President, Position 3 | Tacoma Public Schools board page | https://www.tacomaschools.org/about/school-board/board-members | primary | 0.95 |\n| 2 | Term expires November 2029; appointed Nov 2020, elected 2021, re-elected 2023 | Ballotpedia elections page | https://ballotpedia.org/Tacoma_Public_Schools,_Washington,_elections | primary | 0.9 |\n| 3 | Board President elected April 2025 (24-25/25-26 school years) | Central Washington University news | https://www.cwu.edu/about/media-resources/news/2025/04/cwu-alum-elected-president-of-tacoma-public-schools-board-of-directors | secondary | 0.85 |\n| 4 | Education: Lincoln HS, Pierce College AA, CWU BA, City U Master's, pursuing Ed.D | Tacoma Public Schools board page | https://www.tacomaschools.org/about/school-board/board-members | primary | 0.95 |\n| 5 | TPS employee 2008–2017 in multiple roles (coach, case manager, grad specialist, athletic director) | Tacoma Public Schools board page | https://www.tacomaschools.org/about/school-board/board-members | primary | 0.95 |\n\n## §11 New relationships discovered\nkorey-strozier, target=tacoma-schools, relationship=board_president, weight=4, note=\"https://www.tacomaschools.org/about/school-board/board-members\" (already in graph)\nkorey-strozier, target=central-washington-university, relationship=alumnus, weight=1, note=\"https://www.cwu.edu/about/media-resources/news/2025/04/cwu-alum-elected-president-of-tacoma-public-schools-board-of-directors\" (NEW, light institutional tie)\n\n## §12 Assessment\n**Confidence:** High — current role, term dates, and biographical details are confirmed by the TPS primary-source board page and corroborated by Ballotpedia (election data) and CWU (alumni news).\n**Verdict:** Strozier controls the agenda and meeting pace of a five-member elected school board. The board governs a district of about 28,272 students. His power is real but bounded. He is one vote of five. The board employs, not commands, the superintendent. His role is part-time. His path from TPS employee to board member to board president gives him insider knowledge that other directors lack.\n**Defense counter-argument:** A defense could argue the board president is \"ceremonial\" and \"just runs meetings.\" That is partly true. But in a five-member body, the president shapes which motions reach the floor. He also shapes how policy debate is framed. That is real agenda power.\n**Analysis of alternatives:** None warranted — facts are public and uncontested.\n\n**Status:** ✅ researched — 2026-09-19 — tier3-chunk16-rescue."
