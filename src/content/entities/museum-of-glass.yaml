profile: "## §0 why this entity is on the map\nMuseum of Glass is on this map because it is the lasting project of the Russell family. George F. Russell Jr. (1932–2025) co-founded and bankrolled the museum. He built it as an anchor for the Thea Foss Waterway redevelopment. The museum is now a flagship of Tacoma's \"Museum Row\" cultural cluster.\n\nIts 501(c)(3) tax status, its annual revenue of about $5 million, its capital expansion project, and its broad board ties make it a network node. It links Tacoma arts donors to waterfront redevelopment.\n\n## §1 who they are legally\n**FACT** Museum of Glass is a registered 501(c)(3) charitable organization. Its federal tax ID number (EIN) is 91-1669422. Its tax exemption began in January 1996.\n**Source:** https://www.museumofglass.org/press-release-archive (primary; reliability 0.95); https://projects.propublica.org/nonprofits/organizations/911669422 (primary; reliability 0.95); https://www.charitynavigator.org/ein/911669422 (primary; reliability 0.9)\n\n**FACT** The museum sits at 1801 Dock Street, Tacoma, WA 98402. It opened in 2002 on a former Superfund site. Building the museum kicked off the Thea Foss Waterway cleanup and the surrounding museum district. Six museums now sit within walking distance.\n**Source:** https://www.linkedin.com/company/museum-of-glass (secondary; reliability 0.85); https://www.museumofglass.org/george-russell (primary; reliability 0.95).\n\n**FACT** The most recent IRS Form 990 (per ProPublica and Charity Navigator) shows the following. Contributions ranged from about $1.6 million to about $3.1 million in recent years. Program services brought in $1.3 million to $1.6 million. Investment income ranged from $17,000 to $296,000. Total annual revenue sits in the $3 million to $6 million range.\n**Source:** https://projects.propublica.org/nonprofits/organizations/911669422 (primary; reliability 0.9).\n\n**FACT** The Board of Trustees is chaired by Kenneth Farmer, Jr., M.D. He is the Principal of Ken Farmer Advisors, LLC and a retired U.S. Army Major General. The Vice Chair is Walt Riehl. The Secretary is Todd Gilman. He is SVP, Deputy General Counsel, and Secretary of TrueBlue, Inc. Other trustees include Barry Anton, Rex Bates, Jonah Bergman, Joanna Carey Cleveland (UPS), Mary Carstensen, Clemencia Castro-Woolery, Curtis Cox, Calvin Gasaway, Brent Heilesen, Ian MacNeil, Marc Mangel, Megan Mead, Altaf Merchant (Milgard Endowed Dean, UW Tacoma), Katelyn Smith, and others.\n**Source:** https://museumofglass.org/board (primary; reliability 0.9).\n\n## §2 Power basis\n**FACT** The museum runs a working Hot Shop. It is one of the largest and most active museum glass studios on the West Coast. That gives it cultural power. The museum curates national traveling shows, runs artist residencies, and shapes Tacoma's identity as a glass-arts city. Tacoma is the birthplace of Dale Chihuly.\n**Source:** https://www.linkedin.com/company/museum-of-glass (secondary; reliability 0.85); https://museumofglass.org/board (primary; reliability 0.9)\n\n**FACT** The museum receives Tacoma Creates funding. Tacoma Creates is a voter-approved city fund for arts, culture, and science. The museum also runs a 2026 capital campaign for expansion. Its mix of donations and program-service revenue shows blended public and private support.\n**Source:** https://www.museumofglass.org (primary; reliability 0.9); https://projects.propublica.org/nonprofits/organizations/911669422 (primary; reliability 0.9).\n\n**FACT** George F. Russell Jr. (1933–2025) co-founded the museum with Phil Phibbs. He co-chaired the founding Board of Trustees with Jane Russell. The museum's Hot Shop is named the \"Jane Russell Hot Shop\" in her memory after her early death.\n**Source:** https://www.museumofglass.org/george-russell (primary; reliability 0.95).\n\n## §3a what they influence \n| Indicator | Evidence |\n|---|---|\n| **Who benefits** | The Tacoma museum district, arts patrons, the glass-art community, the Chihuly tourism economy, and Foss Waterway businesses. |\n| **Who sits** | Trustees include Kenneth Farmer (chair, retired US Army general), Todd Gilman (TrueBlue), Joanna Carey Cleveland (UPS), and Altaf Merchant (UW Tacoma Milgard Dean), plus community volunteers. The board cuts across many sectors. |\n| **Who governs** | The Board of Trustees governs the museum. The executive leadership runs daily operations. Derek Klein is listed as staff on LinkedIn. |\n| **Who wins** | The Russell family legacy is permanently anchored in Tacoma's waterfront. Tacoma's cultural tourism brand wins. |\n\n## §7 who they are connected to\nMuseum of Glass is a cultural-anchor node. It bridges three things. First, the Russell family's giving legacy (graph edge: russell-family → museum-of-glass, weight=4). Second, higher education. Altaf Merchant, the Milgard Dean at UW Tacoma, sits on the board. Joanna Carey Cleveland of the University of Puget Sound also sits on the board. Third, downtown Tacoma's museum cluster, with six museums within walking distance. The museum sits on a cleaned-up Superfund site, making it a waterfront-redevelopment success story.\n\n## §10 Sources\n| # | Claim | Source | URL | Type | Reliability |\n|---|---|---|---|---|---|\n| 1 | 501(c)(3); EIN 91-1669422; tax-exempt since Jan 1996 | Museum of Glass press archive | https://www.museumofglass.org/press-release-archive | primary | 0.95 |\n| 2 | ProPublica 990 filing data (revenue mix by year) | ProPublica Nonprofit Explorer | https://projects.propublica.org/nonprofits/organizations/911669422 | primary | 0.9 |\n| 3 | George Russell legacy, Jane Russell Hot Shop, founding with Phil Phibbs | Museum of Glass \"Remembering George Russell\" page | https://www.museumofglass.org/george-russell | primary | 0.95 |\n| 4 | Board of Trustees roster (Farmer chair, Gilman secretary, Merchant, Cleveland, etc.) | Museum of Glass board page | https://museumofglass.org/board | primary | 0.9 |\n| 5 | Opened 2002 on former Superfund site; anchors Thea Foss Waterway restoration | Museum of Glass LinkedIn | https://www.linkedin.com/company/museum-of-glass | secondary | 0.85 |\n\n## §11 New relationships discovered\nmuseum-of-glass, target=russell-family, relationship=legacy, weight=4, note=\"https://www.museumofglass.org/george-russell\" (already in graph)\nmuseum-of-glass, target=uw-tacoma, relationship=board_interlock, weight=2, note=\"https://museumofglass.org/board (Altaf Merchant, Milgard Endowed Dean, UW Tacoma)\" (NEW)\nmuseum-of-glass, target=university-puget-sound, relationship=board_interlock, weight=2, note=\"https://museumofglass.org/board (Joanna Carey Cleveland, VP/General Counsel/Chief of Staff/Secretary of Board of Trustees, University of Puget Sound)\" (NEW)\n\n## §12 Assessment\n**Confidence:** High for who they are legally, founding legacy, board roster, and tax status — confirmed by Museum of Glass primary sources plus ProPublica 990 data. The graph's \"Russell legacy\" framing is directly corroborated.\n**Verdict:** Museum of Glass holds cultural-influence power and a durable waterfront anchor. The Russell family legacy is baked into the institution. It is not a decision-making power node in the regulatory sense. But its board ties (UW Tacoma, UPS, TrueBlue, retired military) place it at a small-network crossroads. Its power is bounded by 501(c)(3) limits and by the visitor market for the museum district.\n**Defense counter-argument:** A defense could argue the museum is \"just a cultural nonprofit.\" That is true in form. But the Russell family origin, the waterfront Superfund cleanup role, and the multi-sector board make it a heritage node in the local power network.\n**Analysis of alternatives:** None warranted — public record is consistent.\n\n**Status:** ✅ researched — 2026-09-19 — tier3-chunk16-rescue."
