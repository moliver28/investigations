profile: "## 0. Why this person or group is on the map\n- **Why she is on the map:** Melanie Morgan holds elected office in the 29th LD. That district covers South Tacoma, East Lakewood, Parkland, and parts of Spanaway. All inside Pierce County. She serves as vice chair of a House committee (Housing, Community Development, and Veterans). That gives her a voice on housing policy and on housing budget items that touch Pierce County (source #1, #6). She also sits on the board of the Pierce County Housing Authority. That puts her on both sides — state housing laws and county housing operations (source #1).\n- **Why others near her are NOT on the map:** Rep. Steve Kirby (D-29, Position 2) is a co-legislator in the same district but not included at this tier. Steve Hickle (her predecessor or successor on the Housing Authority board) — UNVERIFIED.\n\n## 1. Who they are\n- **Legal name:** Melanie Virginia Morgan (source #2).\n- **Birth:** Born November 11, 1967 (source #2). Birthplace UNVERIFIED.\n- **Home:** Spanaway, WA (source #1).\n- **Family:** UNVERIFIED — no public records found.\n- **Education:** Graduate of St. Martin's University (source #1). Exact degree UNVERIFIED.\n- **Military service:** US Army Veteran (source #1).\n- **Career before the legislature:** Mortgage banker (since 1997). Safe housing coordinator. Commissioner on the board of the Pierce County Housing Authority. Board member of Community Healthcare. Domestic Violence and Sexual Assault Advocate. Former school board director for Franklin Pierce Schools (source #1).\n\n## 3. Where their power comes from\n- **Elected office:** WA House of Representatives, District 29, Position 1. Took office January 14, 2019. Current term ends January 11, 2027 (source #3).\n- **Leadership role:** Vice Chair of the Housing, Community Development, and Veterans Committee (source #6, #7). Served as Deputy Democratic Floor Leader from 2019 to 2023 (source #4).\n- **Where her power lies:**\n - Housing policy: Vice chair of the Housing Committee. Former Pierce County Housing Authority commissioner. Career as a mortgage banker and safe housing coordinator (source #1, #6).\n - Racial equity: Championed the CROWN Act (HB 2602, 2020). Led the Community Reinvestment Account ($200M, 2022-2023). Sponsored the Juneteenth state holiday (HB 1016, 2021) (source #1).\n - Agriculture and natural resources: Sits on the Agriculture and Natural Resources Committee. Pushes for equity in farming for people of color (source #1).\n - Education: Former Franklin Pierce School Board director (source #1).\n- **Key facts:**\n - Office and reach: State Representative for the 29th LD, Position 1. Vice Chair of the Housing, Community Development, and Veterans Committee.\n - Budget: As vice chair of the Housing Committee, she shapes housing-related budget items. Led the $200M Community Reinvestment Account (source #1).\n - Powers: No veto power. As vice chair, she influences the committee's agenda.\n - Area covered: Washington State (legislative), 29th LD (electoral), Pierce County (home and work).\n\n## 3. Where their power comes from\n| Indicator | Finding | Evidence (source #) |\n|-----------|---------|---------------------|\n| Who benefits | Marginalized groups in the 29th LD and statewide benefit from her equity-focused bills. Black farmers benefit from her push for farming equity. Pierce County Housing Authority clients gain from her housing expertise. | #1 |\n| Who sits | Vice chair of a standing House committee. Former Pierce County Housing Authority commissioner. Former Franklin Pierce School Board director. Board member of Community Healthcare. | #1, #6 |\n| Who governs | As vice chair, she governs housing and community development bills at the committee stage. She co-governs the 29th LD's voice in the House. | #1, #6 |\n| Who wins | Racial justice groups won through the CROWN Act, Juneteenth, and the Community Reinvestment Account. Housing groups won through her vice chair seat and Housing Authority ties. | #1 |\n\n## 5. How they touch government\n- **Campaign cash (PDC):** Registered with the state campaign-finance agency (PDC) for the 2026 cycle (LEG DISTRICT 29 - HOUSE). 2024: Won general, $0 reported in or out (opted for full reporting). 2022: Won general, $78,892 in, $111,884 out. 2020: Won general, $74,271 in. 2018: Won general, $113,320 in (source #3).\n- **2026 cycle:** Debt $83.88. Independent expenditures for her of $13,553.00 (source #5).\n- **TransparencyUSA (2026):** Total in $46,994. Total out $41,331 (source #8).\n- **Lobbying/contracts/grants:** No lobbyist registration found. As vice chair, she influences housing and community development grant decisions.\n- **Land-use actions:** Her Housing Authority role involves land-use decisions for public housing in Pierce County (source #1).\n\n## 6. Other seats they hold\n- **Board seats:** Pierce County Housing Authority (commissioner). Community Healthcare (board member) (source #1).\n- **Former board seats:** Franklin Pierce Schools (school board director) (source #1).\n- **Old jobs:** Mortgage banker (1997-present, per bio). Safe housing coordinator (source #1).\n- **Advocacy roles:** Domestic Violence and Sexual Assault Advocate (source #1).\n- **Cross-reference:** Her Housing Authority role creates a direct board overlap between state housing laws and county housing operations. Her Community Healthcare role bridges health and housing.\n\n## 9. Who they are connected to\n- Graph connections (from `evidence/29-power-graph-v2.json`):\n\n| Connected entity | Relationship | Weight |\n|---|---|---|\n| Pierce Dems (`pierce-dem`) | member | 3 |\n| Pierce County Council (`county-council`) | state_funding | 4 |\n\n- \nmelanie-morgan, target=pierce-county-housing-authority, relationship=board_member, weight=3, note=\"https://housedemocrats.wa.gov/morgan\".\nmelanie-morgan, target=laurie-jinkins, relationship=caucus_colleague, weight=3, note=\"https://housedemocrats.wa.gov/morgan\".\nmelanie-morgan, target=community-healthcare, relationship=board_member, weight=2, note=\"https://housedemocrats.wa.gov/morgan\".\n\n## 1. Who they are\n| # | Claim | Source | URL | Type (primary/secondary) | Reliability |\n|---|-------|--------|-----|--------------------------|-------------|\n| 1 | Full biography, committee assignments, legislative achievements (CROWN Act, Juneteenth, Community Reinvestment Account), housing career, board roles, military service, education, residence | WA House Democrats — official biography page | https://housedemocrats.wa.gov/morgan | primary | 0.95 |\n| 2 | Legal name (Melanie Virginia Morgan), DOB (Nov 11, 1967), Democratic Party | Wikipedia | https://en.wikipedia.org/wiki/Melanie_Morgan_(politician) | secondary | 0.85 |\n| 3 | District 29 Position 1, assumed office Jan 14, 2019, term ends Jan 2027, campaign finance totals by year, committee assignments | Ballotpedia | https://ballotpedia.org/Melanie_Morgan | secondary | 0.85 |\n| 4 | Deputy Democratic Floor Leader (2019-2023), biographical summary | LegiStorm | https://www.legistorm.com/person/bio/313156/Melanie_Virginia_Morgan.html | secondary | 0.80 |\n| 5 | 2026 PDC candidate filing: debt, independent expenditures | WA Public Disclosure Commission | https://www.pdc.wa.gov/political-disclosure-reporting-data/browse-search-data/candidates/3321325 | primary | 0.95 |\n| 6 | Vice Chair of Housing, Community Development, and Veterans Committee; Capital Budget Committee and Commerce and Gaming Committee member | Tacoma News Tribune | https://www.thenewstribune.com/news/politics-government/article237665389.html | secondary | 0.80 |\n| 7 | Vice Chair role, board appointments, racial equity advocacy | BlackPast.org | https://blackpast.org/african-american-history/melanie-morgan-1967 | secondary | 0.75 |\n| 8 | 2026 campaign finance totals: $46,994 contributions, $41,331 expenditures | TransparencyUSA | https://www.transparencyusa.org/wa/candidate/melanie-morgan | secondary | 0.80 |\n\n## 1. Who they are\n- **The bottom line.** Melanie Morgan shapes housing and community development policy at the committee level as vice chair. Her power is narrow (housing, racial equity), not chamber-wide. She built it through mortgage banking, the Housing Authority, and school board work — a career of expertise. Her biggest budget win is the $200M Community Reinvestment Account. Her power has limits: she is 1 of 98 House members, and she is vice chair (not chair), so she shapes the agenda but does not run it.\n- **Conflicts to watch:** She serves on the Pierce County Housing Authority while sitting on the House Housing Committee. That overlap could matter when bills or budgets touch housing authorities. No formal conflict review found — UNVERIFIED for recusal rules.\n- **The other side:** Her bills (CROWN Act, Juneteenth, Community Reinvestment Account) were caucus-wide priorities that she championed, not solo efforts. Her individual power may be smaller than it looks. Her 2024 re-election showed $0 in reported contributions (opted for full reporting). That suggests limited opposition in a safe D-29 district. Her power comes from the office, not from contested elections.\n- **Confidence:** High — official biography corroborated by Ballotpedia, Wikipedia, PDC filings, and News Tribune. All core facts verified across 2+ sources. Some personal details (birthplace, spouse) remain UNVERIFIED.\n- VERIFIED stamp: N/A (tier2 profile, not tier1)."
