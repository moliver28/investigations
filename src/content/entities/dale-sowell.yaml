profile: "## 0. Why this person or group is on the map\n- **Why Sowell is on the map.** Dale Sowell has sat on the MultiCare Health System board since 2001. MultiCare runs nine hospitals in Washington, including MultiCare Good Samaritan Hospital in Puyallup and Mary Bridge Children's Hospital. It is the largest private employer in Pierce County. Sowell joined the board the same year he became CFO of Green Diamond Resource Company. He has financial oversight over Pierce County's biggest private employer and a regional hospital network. His Green Diamond career ties Pierce County's forest-products capital to Pierce County healthcare governance.\n- **Who is NOT on the map.** John Wiborg (MultiCare board chair), Sally Leighton (Tacoma-based MultiCare director), and other MultiCare board members are not separate entries. Green Diamond's parent company, the Reed Family or Hancock Natural Resource Group, sits at the parent level, not at MultiCare.\n\n## 1. Who they are\n- **Legal name:** Dale L. Sowell (the federal tax agency (IRS) Form 990 filing for MultiCare Health System lists \"Dale L Sowell, Director\").\n- **Career arc:** Joined Green Diamond Resource Company as CFO through a CFO Selections placement. Rose to Vice President and Chief Financial Officer. Retired in 2020.\n- **Where he lives:** Washington State (MultiCare BBB filings show a WA address). His specific city is UNVERIFIED.\n- **Family and birth date:** Not in public sources surveyed (UNVERIFIED).\n\n## 3. Where their power comes from\n- **Healthcare governance:** Long-time MultiCare Health System board director (since 2001 — over 24 years as of 2026). MultiCare is the largest community-based, locally governed nonprofit healthcare system in Washington State. It runs 9 community hospitals with 1,743 adult beds and 152 pediatric beds. It has $5 billion in revenue and about 84,000 admissions a year.\n- **Bridge between two worlds:** Sowell's career spans Green Diamond (a forest-products company based in Seattle) and MultiCare (a healthcare system). As Green Diamond's CFO, he learned audit-grade financial discipline. That maps onto MultiCare's Finance and Audit committee work.\n- **Power-domain overlap:** He moves between institutional (board oversight of a $5 billion health system), economic (forest-products capital), and social (board governance of safety-net healthcare delivery) power.\n- **MultiCare's tax status:** MultiCare is a 501(c)(3) nonprofit. Its tax ID number (EIN) is 91-1352172. GuideStar profiles it.\n- **No government power.** No statutory, elected, or appointed government role was found. No political action committee (PAC) spending, endorsements, or political committee work was found.\n\n## 3. Where their power comes from\n| Indicator | Finding | Evidence (source #) |\n|-----------|---------|---------------------|\n| Who benefits | Pierce County residents who use MultiCare's nine hospitals — including Good Samaritan in Puyallup, Mary Bridge Children's, and Tacoma General — benefit from a board with long-time financial expertise. | 1, 4 |\n| Who sits | Dale Sowell — Director since 2001, one of the longest-serving outside directors on MultiCare's 12-person board. His title is not given on the public bio, but his tenure and Green Diamond CFO background imply a heavy Finance and Audit role. | 1 |\n| Who governs | The MultiCare system board sets policy, strategic direction, and oversees the CEO. Sowell has been a director since 2001. | 1, 4 |\n| Who wins | MultiCare, Pierce County's dominant healthcare nonprofit, keeps building power over regional care, insurance contracts, and doctor hiring. Sowell's 24-year tenure gives him rare continuity and relationships. | 1, 4 |\n\n## 9. Who they are connected to\n- Graph connections (from `evidence/29-power-graph-v2.json`):\n\n| Connected entity | Relationship | Weight |\n|---|---|---|\n| MultiCare Health (`multicare`) | board | 4 |\n| Green Diamond (`green-diamond`) | former_cfo | 4 |\n\n- \n`dale-sowell`, target=`multicare`, relationship=director_since_2001, weight=4, note=\"https://www.multicare.org/about/leadership/board-directors\".\n`dale-sowell`, target=`green-diamond`, relationship=vp_cfo_retired_2020, weight=3, note=\"https://www.cfoselections.com/news/cfo-selections-places-cfo-at-green-diamond\".\n\n## 1. Who they are\n| # | Claim | Source | URL | Type (primary/secondary) | Reliability |\n|---|-------|--------|-----|--------------------------|-------------|\n| 1 | Dale Sowell Director since 2001; retired 2020 as VP/CFO of Green Diamond Resource Company; MultiCare is largest community-based, locally governed healthcare tax-exempt organization in WA (9 hospitals, 1,743 adult beds, 152 pediatric) | MultiCare Health System official website (Board of Directors page) | https://www.multicare.org/about/leadership/board-directors | primary | 1.0 |\n| 2 | MultiCare Board roster listing Dale Sowell (Public Record exhibit, Oregon Health Authority filing referencing WA MultiCare 990/board) | Oregon Health Authority public exhibit reproducing MultiCare Board of Directors | https://www.oregon.gov/oha/HPA/HP/Form%20A%20Page%20Docs/FA-03%20Exhibit%203.a.i%20-%20PUBLIC%20MultiCare%20Board%20of%20Directors.pdf | secondary | 0.90 |\n| 3 | Dale Sowell joined Green Diamond Resource Company as CFO (placement announcement, \"more than 30 years of finance and accounting leadership\") | CFO Selections placement announcement | https://www.cfoselections.com/news/cfo-selections-places-cfo-at-green-diamond | secondary | 0.85 |\n| 4 | MultiCare Health System EIN 91-1352172; Dale L Sowell listed as DIRECTOR on most recent 990 | GuideStar (Candid) IRS Form 990 profile | https://www.guidestar.org/profile/91-1352172 | primary | 0.95 |\n| 5 | Dale Sowell — Vice President / Chief Financial Officer at Green Diamond Resource Company (40 yrs experience, Washington location) | SignalHire / The Org | https://www.signalhire.com/companies/green-diamond-resource-company/employees | secondary | 0.70 |\n\n## 1. Who they are\n- **The bottom line.** Dale Sowell holds power through his seat on the MultiCare Health System board. MultiCare is the largest private healthcare group in Pierce County. Sowell has been a director since 2001 — 24 years. As Green Diamond's retired VP and CFO, he brings deep financial skills. He is likely a senior figure on MultiCare's Finance and Audit function.\n- **Conflicts-of-interest flags.** The MultiCare board bio does not name Sowell's committees. His exact committee roles and any related-party deals would need a direct read of the IRS Form 990 Schedule L (UNVERIFIED). Long service on a nonprofit board with no public term limits is itself a governance flag.\n- **Two readings.** Defense view: Sowell's steady financial stewardship helps keep MultiCare stable. Opposing view: MultiCare's dominance in Pierce County (Tacoma General, Good Samaritan, Mary Bridge) puts healthcare decisions in the hands of a few long-serving outside directors. There is little public accountability for board renewal or contested elections.\n- **Confidence:** Medium — primary sources confirm board membership and Green Diamond tenure. Deeper biographical detail (birth date, education, residence, specific committee roles) is UNVERIFIED in surveyed sources."
