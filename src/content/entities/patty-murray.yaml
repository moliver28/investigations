profile: "## 0. Why this person or group is on the map\n- **Inclusion rule:** decision-making and from holding office. Murray is the senior U.S. Senator from Washington State. She serves as Vice Chair of the Senate Appropriations Committee. That committee is the most powerful funding committee in Congress. She controls Congressionally Directed Spending (CDS) for Washington State. That includes Pierce County projects.\n\nShe secured more than $121 million in CDS for WA projects in FY2026 alone. She also brought in more than $5 billion in direct state funding (source #1, #2).\n\nHer former role as President Pro Tempore (2023–2025) placed her third in line for the U.S. presidency. That was the highest federal position held by anyone in this investigation's scope.\n- **Adjacent but EXCLUDED candidates:** Sen. Maria Cantwell is Washington's junior senator. She is on the map separately. Gov. Bob Ferguson handles state-level executive power. Rep. Emily Randall (D-6) handles district-level Pierce County representation.\n\n## 1. Who they are\n- **Legal name:** Patricia Lynn Murray (née Johns) (source #2).\n- **Born:** October 11, 1950, in Bothell, Washington (source #2, #4).\n- **Lives in:** Washington State (specific city UNVERIFIED — public records do not list a home address, given her former President Pro Tempore status and security concerns).\n- **Family:** Husband Rob Murray (married 1972). Two children (source #2). Her father was a WWII veteran and Purple Heart recipient. He later developed MS. Her mother worked to support the family (source #1).\n- **Education:** B.A. in Physical Education from Washington State University, 1972 (source #2, #3).\n- **Career before Senate:** Preschool teacher at Shoreline Community College. Citizen lobbyist for environmental and education issues. Shoreline School Board (1985–1989). Washington State Senate, 1st District (1989–1993). She served as whip from 1990 to 1992 (source #2, #4).\n\n## 3. Where their power comes from\n- **Elected office:** U.S. Senator from Washington (senior senator). She took office on January 3, 1993. This is her sixth term, won in 2022. Her next election is 2028 (source #2, #5).\n- **Leadership roles:**\n  - Vice Chair, Senate Appropriations Committee (since January 3, 2025) (source #1, #2).\n  - Former Chair, Senate Appropriations Committee (2023–2025) (source #1).\n  - Former President Pro Tempore of the Senate (January 3, 2023 – January 3, 2025). She was the first woman to hold this position (source #2, #4).\n  - Senate Democratic leadership member since 2007 (source #1).\n  - Former Chair, Senate Veterans' Affairs Committee (112th Congress). She was the first female chair (source #1, #4).\n  - Former Chair, Senate Budget Committee (113th Congress). First female chair (source #1).\n  - Former Chair, Senate HELP Committee (source #1).\n- **Power domains:**\n  - Federal appropriations: She is Vice Chair (formerly Chair) of Appropriations. She co-controls all federal discretionary spending, about $1.7 trillion a year. She is Ranking Member of the Energy and Water Development Subcommittee (source #1, #6, #7).\n  - Health, education, and labor: She sits on the HELP Committee. She shapes health care, education, and labor policy. As former Chair, she helped negotiate the No Child Left Behind rewrite, the 21st Century Cures Act, and COVID relief (source #1).\n  - Budget: Senate Budget Committee member (source #6, #7).\n  - Veterans' affairs: Senate Veterans' Affairs Committee member. As former Chair, she expanded women's veterans' benefits and caregiver support (source #1).\n  - Child care and paid leave: A leading Senate advocate for child care and paid leave (source #1).\n- **key facts:**\n  - Offices: U.S. Senator (statewide), Vice Chair of Appropriations, four committee assignments.\n  - Budget control: She co-controls all federal discretionary spending as Appropriations Vice Chair. She secured about $500 million in CDS for WA in FY2026. She secured more than $5 billion in direct state funding, including $3.22 billion for Hanford (source #1, #2).\n  - Appointment and veto: She has Senate confirmation authority over executive appointments. She has no veto power. Her Appropriations role gives her an effective veto over funding for federal programs.\n  - Jurisdictions: Washington State (statewide elections) and the United States (legislative).\n\n## 3. Where their power comes from\n| Indicator | Finding | Evidence (source #) |\n|-----------|---------|---------------------|\n| Who benefits | Washington State communities benefit from $500 million-plus in CDS and $5 billion-plus in direct funding for FY2026. Working families benefit from her child care, paid leave, and education advocacy. Veterans benefit from expanded VA benefits. Hanford workers benefit from $3.22 billion. | #1, #2 |\n| Who sits | Murray sits as Vice Chair of the most powerful Senate committee, Appropriations. She also sits on HELP, Budget, and Veterans' Affairs. She is a former President Pro Tempore (third in line for the presidency). She has been in Senate Democratic leadership since 2007. | #1, #2 |\n| Who governs | As Appropriations Vice Chair, she co-governs all federal discretionary spending. She governs health, education, and labor policy through HELP. She governs veteran policy through Veterans' Affairs. | #1, #6, #7 |\n| Who wins | Progressive priorities: child care, paid leave, reproductive rights, climate action, COVID relief, the No Child Left Behind rewrite, the 21st Century Cures Act, and the Bipartisan Budget Act of 2013 (with Paul Ryan). | #1 |\n\n## 5. How they touch government\n- **Campaign finance (FEC):** FEC candidate ID is M001111 (source #7). Cycle-by-cycle totals were not pulled in this session — UNVERIFIED for specific donation amounts. Ballotpedia lists elections in 1992, 1998, 2004, 2010, 2016, and 2022 (source #5).\n- **Congressionally Directed Spending (CDS):**\n  - FY2026: about $500 million in CDS across all appropriations bills (source #1).\n  - FY2026 three-bill package: $331.438 million in CDS for local WA projects. $3.22 billion for Hanford. More than $5 billion in total direct state funding (source #2).\n  - FY2026 THUD bill: $81.229 million for 29 CDS transportation and housing projects (source #1).\n  - FY2026 five-bill package: more than $121 million in CDS for local community-based projects (source #1).\n- **Lobbying, contracts, and grants:** Murray has no lobbying registration (she is a sitting senator). As Appropriations Vice Chair, she is the main federal funding channel for Washington State.\n- **Pierce County-specific funding:** UNVERIFIED. Specific CDS line items for Pierce County were not extracted in this session. The $190 million for Howard Hanson Dam (source #2) is a Washington State project relevant to Pierce County water. (Howard Hanson Dam is on the Green River in King County, but it affects regional water management including Pierce County.) This is a gap for follow-up.\n\n## 6. Other seats they hold\n- **Board seats:** None at this time. As a sitting U.S. Senator, board service is limited by Senate ethics rules. UNVERIFIED for any pre-Senate board service.\n- **Employment ties:** Former preschool teacher at Shoreline Community College. Former member of the Shoreline School Board (1985–1989) (source #2, #4).\n- **Legislative ties:** Former Washington State Senator (1989–93). That creates a board overlap with current WA State Senate members. She co-negotiated the Bipartisan Budget Act of 2013 with Rep. Paul Ryan (source #1).\n- **Cross-reference:** Her Appropriations seat creates the most significant board overlap. It links her to every federal agency and to state and local governments that get federal money, including Pierce County entities. Her former HELP chairmanship links her to health care and education institutions across WA.\n\n## 9. Who they are connected to\n- Graph connections (from `evidence/29-power-graph-v2.json`):\n\n| Connected entity | Relationship | Weight |\n|---|---|---|\n| Pierce County Council (`county-council`) | federal_funding | 4 |\n| Pierce Dems (`pierce-dem`) | member | 3 |\n\n- \npatty-murray, target=maria-cantwell, relationship=senate_colleague, weight=4, note=\"https://en.wikipedia.org/wiki/Patty_Murray\".\npatty-murray, target=emily-randall, relationship=party_colleague, weight=3, note=\"https://www.murray.senate.gov/biography\".\npatty-murray, target=laurie-jinkins, relationship=federal_state_funding, weight=3, note=\"https://www.murray.senate.gov/passed-murray-secures-hundreds-of-millions-for-transportation-housing-projects-across-wa-in-final-appropriations-bills-boosts-funding-for-medical-research-housing-child-care-more\".\n\n## 1. Who they are\n| # | Claim | Source | URL | Type (primary/secondary) | Reliability |\n|---|-------|--------|-----|--------------------------|-------------|\n| 1 | Full biography, committee assignments, leadership roles, legislative achievements, Appropriations Vice Chair role, CDS totals ($121M+, $81M THUD, $500M total) | US Senate — Murray official biography | https://www.murray.senate.gov/biography | primary | 0.95 |\n| 2 | Legal name (Patricia Lynn Murray née Johns), DOB (Oct 11, 1950), Bothell birthplace, WSU education, spouse (Rob Murray, m. 1972), 2 children, WA State Senate (1989-93), President Pro Tempore (2023-2025), Vice Chair Appropriations (2025-) | Wikipedia | https://en.wikipedia.org/wiki/Patty_Murray | secondary | 0.85 |\n| 3 | Education (BA Physical Education, WSU 1972), career as preschool teacher, citizen lobbyist, Shoreline School Board, WA State Senate whip | Ballotpedia | https://ballotpedia.org/Patty_Murray | secondary | 0.85 |\n| 4 | Career timeline, first female senator from WA, first female President Pro Tempore, committee firsts (Veterans' Affairs, Budget) | Archives of Women's Political Communication (Iowa State Univ.) | https://awpc.cattcenter.iastate.edu/directory/patty-murray | secondary | 0.80 |\n| 5 | Multiple election cycles, committee assignments, voting record, legislative scorecards | Ballotpedia | https://ballotpedia.org/Patty_Murray | secondary | 0.85 |\n| 6 | Committee assignments: Appropriations (Vice Chair + 5 subcommittees), HELP, Budget, Veterans' Affairs; subcommittee details | US Senate — Murray official committee page | https://www.murray.senate.gov/committee-assignments | primary | 0.95 |\n| 7 | Congress.gov committee assignments: Appropriations Ranking Member, Energy & Water Ranking Member, HELP subcommittees, Budget, Veterans' Affairs | Congress.gov | https://www.congress.gov/member/patty-murray/M001111/committees | primary | 0.95 |\n| 8 | FY2026 appropriations: $5B+ direct WA funding, $3.22B Hanford, $331.438M CDS, $190M Howard Hanson Dam, defeated 140+ Republican policy riders | US Senate — Murray press release | https://www.murray.senate.gov/passed-murray-secures-over-5-billion-for-wa-priorities-in-three-bill-funding-package-historic-funding-for-hanford-190-million-for-howard-hanson-dam-rejecting-trump-cuts | primary | 0.95 |\n| 9 | FY2026 five-bill package passage: $121M+ CDS for WA, 29 THUD CDS projects ($81.229M), Senate vote 71-29 | US Senate — Murray press release | https://www.murray.senate.gov/passed-murray-secures-hundreds-of-millions-for-transportation-housing-projects-across-wa-in-final-appropriations-bills-boosts-funding-for-medical-research-housing-child-care-more | primary | 0.95 |\n\n## 1. Who they are\n- **Verdict:** Murray controls more federal funding for Washington State than any other single person. She does this as Vice Chair (formerly Chair) of the Senate Appropriations Committee. She secured about $500 million in CDS and more than $5 billion in direct WA funding for FY2026 alone. She gained this power through 33-plus years of Senate seniority (since 1993). She also gained it through progressive committee leadership (first female chair of Veterans' Affairs, Budget, HELP, and Appropriations). She has been in Senate Democratic leadership since 2007. Her former President Pro Tempore role (2023–2025) made her the highest-ranking woman in U.S. government history at that time. For Pierce County, her Appropriations role is the main federal funding channel. Specific CDS line items for Pierce County still need follow-up.\n- **Conflicts-of-interest flags:** No major COI flags found. As a long-serving senator with broad Appropriations authority, the main risk is generalized favor-trading rather than specific conflicts. Senate ethics disclosures are required but were not reviewed in this session. UNVERIFIED for specific financial holdings.\n- **Analysis of alternatives :** An opposing reading: as Vice Chair in the minority party since January 2025, Murray's power is smaller than during her 2023–2025 Chair tenure. The Republican chair (Sen. Collins) controls the committee agenda. Murray's 2022 re-election was her closest race in years, which suggests possible electoral risk. Her composite power score (0.032, rank 64/163) may undervalue her federal-level influence relative to local Pierce County actors. Or it may reflect that her direct Pierce County ties are weaker than her statewide and national profile.\n- **Confidence:** High — multiple primary sources (Senate official site, Congress.gov, press releases) corroborated by secondary sources (Ballotpedia, Wikipedia, Iowa State archives). Core facts verified across 3+ sources. CDS line items for Pierce County specifically remain UNVERIFIED — gap for follow-up.\n- VERIFIED stamp: N/A (tier2 profile, not tier1)."
