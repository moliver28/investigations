profile: "## §0 why this entity is on the map\nBates Technical College is on the map because it is one of two main technical colleges in Tacoma (alongside TCC). It feeds Pierce County's apprenticeship and skilled-trades pipeline. It also runs KBTC-TV PBS, which gives it a media footprint in the network.\n\n## §1 who they are legally\n**FACT** Bates Technical College is a public technical college in Tacoma, Washington. It was founded in 1940.\n**Source:** https://en.wikipedia.org/wiki/Bates_Technical_College (secondary; reliability 0.85)\n\n**FACT** In 1940, a trade school program started in the basement of Hawthorne Elementary School. In the 1941–42 school year, it was named Tacoma Vocational School. In 1944, LaVerne Hazen Bates (L. H. Bates) became the school's director. In 1947, the school was renamed Tacoma Vocational-Technical Institute. After L. H. Bates retired in 1969, the Tacoma School Board renamed it the \"L. H. Bates Vocational Technical Institute.\"\n**Source:** https://en.wikipedia.org/wiki/Bates_Technical_College (secondary; reliability 0.85).\n\n**FACT** In 1991, Washington State pulled the vocational schools out of local school districts. They then came under the State Board for Community and Technical Colleges.\n**Source:** https://en.wikipedia.org/wiki/Bates_Technical_College (secondary; reliability 0.85).\n\n**FACT** In 1992, the college took over KTPS-TV, a PBS station in Tacoma, from the Tacoma School District. It renamed the station KBTC-TV on October 12.\n**Source:** https://en.wikipedia.org/wiki/Bates_Technical_College (secondary; reliability 0.85).\n\n## §2 Governance\n**FACT** A five-member Board of Trustees runs Bates Technical College. The Governor of Washington appoints the trustees. They set policy, hire the president, approve the budget, and award faculty tenure.\n**Source:** https://www.batestech.edu/about-bates/college-governance (primary; reliability 0.95)\n\n**FACT** Board Chair Florence Chang took the role in August 2019. She is also President of MultiCare Health System. This makes her a direct board link between Bates and Pierce County's biggest healthcare system.\n**Source:** https://www.batestech.edu/about-bates/college-governance (primary; reliability 0.95).\n\n**FACT** Trustee Christina Blocker was appointed by Governor Jay Inslee in 2016. She is the first African American woman to serve on the Bates board. She is also President of the National African American Caucus of Community College Trustees.\n**Source:** https://www.batestech.edu/about-bates/college-governance (primary; reliability 0.95).\n\n## §3a what they influence \n| Indicator | Evidence |\n|---|---|\n| **Who benefits** | Bates students, apprenticeship-employer partners, and KBTC-TV's South Sound PBS viewers. |\n| **Who sits** | Board Chair Florence Chang (MultiCare President) creates a direct board link between Bates and Pierce County's largest healthcare system. |\n| **Who governs** | The Governor-appointed Board of Trustees; the State Board for Community and Technical Colleges provides system oversight. |\n| **Who wins** | Apprenticeship and skilled-trades employers in Pierce County. |\n\n## §4 Money\n**UNVERIFIED** Bates Technical College's yearly budget, enrollment, and revenue sources are not listed in public summaries reviewed here. UNVERIFIED.\n\n## §7 who they are connected to\nBates Technical College is a structural link between **education** (technical college), **media** (KBTC-TV PBS), **healthcare** (MultiCare board link through Florence Chang), and **workforce development**. The MultiCare board link is the highest-weight tie for Bates in this network.\n\n## §10 Sources\n| # | Claim | Source | URL | Type | Reliability |\n|---|---|---|---|---|---|\n| 1 | Public technical college, founded 1940, Tacoma WA | Wikipedia | https://en.wikipedia.org/wiki/Bates_Technical_College | secondary | 0.85 |\n| 2 | 1991: joined State Board for Community and Technical Colleges; 1992: took over KBTC-TV | Wikipedia | https://en.wikipedia.org/wiki/Bates_Technical_College | secondary | 0.85 |\n| 3 | Governor-appointed 5-member Board of Trustees | Bates Technical College | https://www.batestech.edu/about-bates/college-governance | primary | 0.95 |\n| 4 | Board Chair Florence Chang = MultiCare President (board link) | Bates Technical College | https://www.batestech.edu/about-bates/college-governance | primary | 0.95 |\n\n## §11 New relationships discovered\nflorence-chang, target=bates-tech, relationship=appointed, weight=1, note=\"https://www.batestech.edu/about-bates/college-governance\"\nbates-tech, target=kbtc, relationship=governs, weight=1, note=\"https://en.wikipedia.org/wiki/Bates_Technical_College\"\n\n## §12 Assessment\n**Confidence:** High for governance structure and board-link claims (primary Bates official sources); Medium for budget (no public summary).\n**Defense counter-argument:** A defense could say Bates is just one of 34 Washington community and technical colleges. True at the system level. But its PBS ownership plus the MultiCare board link give it more local visibility and network weight than peer colleges.\n**Analysis of alternatives:** None warranted.\n\n**Status:** ✅ researched — 2026-09-19 — tier3-chunk11-rescue."
