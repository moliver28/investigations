profile: "## §0 why this entity is on the map\nClancy is on this map because he is the elected Board Chair of West Pierce Fire & Rescue. That agency is Pierce County Fire Protection District No. 3. It is a special-purpose district with a multi-million-dollar annual budget (the v2 graph notes $75.5 million). It provides fire and EMS service to Lakewood and nearby communities. Clancy has served as a fire commissioner since 2004.\n\nThe task label \"Pierce Transit\" appears to be a misattribution. No primary source links John Clancy to Pierce Transit. The link was checked against Ballotpedia, LinkedIn, and West Pierce Fire's own records.\n\n## §1 Identity\n**FACT** John Clancy is the Board Chair of the West Pierce Fire & Rescue Board of Fire Commissioners. He holds Position 2. His term runs from 2022 to 2027.\n**Source:** https://www.westpierce.org/elected-officials (primary; reliability 0.95); https://www.westpierce.org/wp-content/uploads/Minutes-011326.pdf (primary; reliability 0.95)\n\n**FACT** Clancy has represented district residents as a fire commissioner since 2004. He has served as Chair and Vice Chair during that time.\n**Source:** https://www.westpierce.org/elected-officials (primary; reliability 0.95).\n\n**FACT** He attended the University of Puget Sound. He earned a Bachelor of Arts in Communications in 1985.\n**Source:** https://www.westpierce.org/elected-officials (primary; reliability 0.95).\n\n**FACT** Clancy has lived in Lakewood since 1969. He has three sons. He served on the Clover Park Citizens' Committee for Schools. He has volunteered for Paint Tacoma-Pierce Beautiful. Per the 2024 Adopted Budget, he served as past president of the Kiwanis Club of Clover Park. He still serves on its Board of Directors.\n**Source:** https://www.westpierce.org/elected-officials (primary; reliability 0.95); https://www.westpierce.org/wp-content/uploads/2024-Budget.pdf (primary; reliability 0.95).\n\n**FACT** His professional career is in sales and recruiting. He worked at Cardinal Health as a Technical Sales Consultant (Jan 2019–Apr 2020). He worked at ManpowerGroup as a Corporate Recruiter (Aug 2015–Jan 2019). He worked at F5 Networks as a Sourcing Recruiter (Jan 2015–Apr 2015). He was an Account Executive at Boise Office Solutions from 1997 to 2003. He was a Spinal Sales Representative at Cascade Medical/Acromed from Aug 1996 to Oct 1997.\n**Source:** https://www.linkedin.com/in/john-clancy-a812498 (secondary; reliability 0.7).\n\n## §2 Power basis\n**FACT** As Board Chair, Clancy runs meetings of the five-member elected Board of Fire Commissioners. He sets agendas and signs proclamations (per Jan 2026 minutes). He provides public leadership for a fire district that adopts its own budget and levies property-tax assessments.\n**Source:** https://www.westpierce.org/wp-content/uploads/Minutes-011326.pdf (primary; reliability 0.95); https://www.westpierce.org/wp-content/uploads/Minutes-031026.pdf (primary; reliability 0.95)\n\n**FACT** The Board oversees West Pierce Fire & Rescue operations. The district adopted a multi-million-dollar 2024 budget. The v2 graph records $75.5 million in board oversight.\n**Source:** https://www.westpierce.org/wp-content/uploads/2024-Budget.pdf (primary; reliability 0.95).\n\n**FACT** This is an elected position, not an appointed one. Voters of Pierce County Fire District No. 3 elect the commissioners. Position 2 runs through 2027.\n**Source:** https://www.westpierce.org/elected-officials (primary; reliability 0.95).\n\n## §3a what they influence \n| Indicator | Evidence |\n|---|---|\n| **Who benefits** | District residents benefit from fire and EMS service. Career firefighters and staff benefit from board-approved contracts. |\n| **Who sits** | Clancy sits as one of five elected commissioners. He chairs the board that oversees a $75 million-plus budget. |\n| **Who governs** | The board governs the fire district. The chair sets the agenda. Fire Chief Ryan McGrady runs day-to-day operations. |\n| **Who wins** | Outcomes of levy and bond votes that follow board advocacy. West Pierce budget documents note past levy and bond activity. |\n\n## §7 who they are connected to\nClancy is a long-tenured local elected official in the Lakewood and Clover Park area. He sits at the intersection of special-purpose-district government (West Pierce Fire) and community civic life. His civic ties include the Clover Park Kiwanis, the Clover Park Citizens' Committee for Schools, and Paint Tacoma-Pierce Beautiful. His career outside government was in corporate sales and recruiting. His network is local and civic rather than business-elite.\n\n## §10 Sources\n| # | Claim | Source | URL | Type | Reliability |\n|---|---|---|---|---|---|\n| 1 | Board Chair, West Pierce Fire & Rescue, Position 2, 2022–2027 | West Pierce Fire elected officials page | https://www.westpierce.org/elected-officials | primary | 0.95 |\n| 2 | Commissioner since 2004; Chair and Vice-Chair during tenure | West Pierce Fire elected officials page | https://www.westpierce.org/elected-officials | primary | 0.95 |\n| 3 | Chair Clancy called the meeting to order at 5:33 (Jan 2026 minutes) | West Pierce Fire board minutes (PDF) | https://www.westpierce.org/wp-content/uploads/Minutes-011326.pdf | primary | 0.95 |\n| 4 | University of Puget Sound BA Communications 1985; Lakewood resident since 1969 | West Pierce Fire elected officials page + 2024 Adopted Budget | https://www.westpierce.org/elected-officials | primary | 0.95 |\n| 5 | Career in sales/recruiting (Cardinal Health, ManpowerGroup, F5, Boise Office Solutions) | LinkedIn | https://www.linkedin.com/in/john-clancy-a812498 | secondary | 0.7 |\n\n## §11 New relationships discovered\njohn-clancy, target=west-pierce-fire, relationship=chair, weight=4, note=\"https://www.westpierce.org/elected-officials\" (already in graph)\njohn-clancy, target=clover-park-schools, relationship=committee_member, weight=1, note=\"https://www.westpierce.org/elected-officials\" (NEW, civic committee tie to Clover Park Schools)\n\n## §12 Assessment\n**Confidence:** High for the West Pierce Fire role (multiple primary sources: elected-officials page, 2024 budget PDF, board minutes). Medium for biographical detail (LinkedIn self-reported). The \"Pierce Transit\" tag in the assignment appears to be incorrect — no primary source links Clancy to Pierce Transit.\n**Verdict:** Clancy chairs an elected five-member board. The board governs a fire district with a budget over $75 million in Lakewood. His power is local, bounded, and durable. He has served on the board for 22 years. He is currently the chair. He has governance standing but not personal control. Fire Chief Ryan McGrady runs operations. Clancy sets the agenda and represents the district publicly.\n**Defense counter-argument:** A defense could argue the board chair is \"ceremonial.\" That is partly true. But in special-purpose districts, the chair controls meeting agendas. The chair signs official papers such as proclamations and minutes. The chair is the public face during levy and bond campaigns and during labor disputes.\n**Analysis of alternatives:** None warranted on facts. The assignment's \"Pierce Transit\" tag does not match the public record. That is flagged in the Graph description above.\n\n**Status:** ✅ researched — 2026-09-19 — tier3-chunk16-rescue."
