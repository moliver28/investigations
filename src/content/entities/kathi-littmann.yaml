profile: "## §0 why this entity is on the map\nLittmann is in the network because she is the chief executive of the Greater Tacoma Community Foundation (GTCF). She has held the job since July 2015. The CEO role puts her in charge of a $207M-asset foundation that has given out $218M in grants over its life. The foundation touches almost every nonprofit and agency in Pierce County. Littmann also sits on the Pacific Lutheran University (PLU) Board of Regents. That seat ties her into PLU's governance.\n\n## §1 Identity\n**FACT** Kathi Littmann, Ed.D., is the President & CEO of the Greater Tacoma Community Foundation (GTCF), based in Gig Harbor, WA. She has been in the role since July 2015. In June 2026 she said she plans to step down by the end of 2027.\n**Source:** https://www.gtcf.org/news-reports/gtcf-marks-45-years-and-looks-to-its-next-chapter (primary; reliability 0.95)\n\n**FACT** Under Littmann's tenure, GTCF assets have grown to more than $207 million. Total grants over the foundation's life have passed $218 million.\n**Source:** https://www.gtcf.org/news-reports/gtcf-marks-45-years-and-looks-to-its-next-chapter (primary; reliability 0.95).\n\n**FACT** She is a member of the Pacific Lutheran University Board of Regents. She was nominated in 2020 for a 2020–2023 term. Her name appears in PLU's Form 990 (the tax filing) as a Regent. The seat is unpaid.\n**Source:** https://www.plu.edu/strategic-planning/2020/05/16/spring-meeting-of-the-board-of-regents (primary; reliability 0.9); PLU Form 990 via ProPublica Nonprofit Explorer: https://projects.propublica.org/nonprofits/organizations/910565571 (primary; reliability 0.9).\n\n**FACT** Her career path includes Senior Program Officer at the Bill & Melinda Gates Foundation (Feb 2013–Jun 2015). She also founded the consulting firm 2RDS in 2002. Earlier work spans education, construction, and national philanthropy.\n**Source:** https://www.linkedin.com/in/kathil (secondary; reliability 0.7); https://www.gtcf.org/news-reports/gtcf-marks-45-years-and-looks-to-its-next-chapter (primary; reliability 0.95).\n\n**FACT** She won the University of Washington Tacoma (UWT) Milgard School of Business 2019 Nonprofit Leader of the Year award. She also won the Philanthropy Northwest Ambassador of the Year award in 2019.\n**Source:** https://www.linkedin.com/in/kathil (secondary; reliability 0.7).\n\n## §2 Power basis\n**FACT** As GTCF President & CEO, Littmann sets the agenda for one of Pierce County's biggest philanthropic groups. GTCF runs more than $207M in assets and has given out $218M+ in total grants. The CEO shapes strategy, equity plans, and key funding partnerships.\n**Source:** https://www.gtcf.org/news-reports/gtcf-marks-45-years-and-looks-to-its-next-chapter (primary; reliability 0.95)\n\n**FACT** Her PLU regent seat gives her a voice in how PLU is run. PLU is a private university that trains many of Pierce County's professionals. PLU also has a big endowment and holds real estate in Parkland.\n**Source:** https://www.plu.edu/strategic-planning/2020/05/16/spring-meeting-of-the-board-of-regents (primary; reliability 0.9).\n\n## §3a what they influence \n| Indicator | Evidence |\n|---|---|\n| **Who benefits** | Pierce County nonprofits that get GTCF grants. Advisory fund holders. PLU as a recipient of regent-guided direction. |\n| **Who sits** | Littmann sits at the head of GTCF. She sits on the PLU Board of Regents. Those are two institutional seats. |\n| **Who governs** | She runs GTCF staff, the leadership team, and key partnerships. She helps run PLU through regent duties (regents are unpaid). |\n| **Who wins** | During her tenure, GTCF assets grew from a small base in 1981 to $207M+. Total grants passed $218M. Donors, advisors, and grantees all won. |\n\n## §7 who they are connected to\nLittmann is a bridge between three worlds: philanthropy (GTCF as grantmaker), higher education (PLU regent seat), and national foundations (her Gates Foundation background). She also serves on the UWT President's Advisory Board and the Milgard Center advisory board, per LinkedIn.\n\n## §10 Sources\n| # | Claim | Source | URL | Type | Reliability |\n|---|---|---|---|---|---|\n| 1 | GTCF President & CEO since July 2015; transition planned by end 2027 | GTCF news release (primary source) | https://www.gtcf.org/news-reports/gtcf-marks-45-years-and-looks-to-its-next-chapter | primary | 0.95 |\n| 2 | GTCF assets >$207M; cumulative grants >$218M | GTCF news release | https://www.gtcf.org/news-reports/gtcf-marks-45-years-and-looks-to-its-next-chapter | primary | 0.95 |\n| 3 | PLU Board of Regents member (2020–2023 term) | PLU Strategic Planning blog | https://www.plu.edu/strategic-planning/2020/05/16/spring-meeting-of-the-board-of-regents | primary | 0.9 |\n| 4 | PLU Form 990 lists Kathi Littmann as Regent, $0 compensation | ProPublica Nonprofit Explorer (PLU 990) | https://projects.propublica.org/nonprofits/organizations/910565571 | primary | 0.9 |\n| 5 | Prior role: Senior Program Officer, Bill & Melinda Gates Foundation (Feb 2013–Jun 2015); founder 2RDS | LinkedIn (self-reported) | https://www.linkedin.com/in/kathil | secondary | 0.7 |\n| 6 | UWT Milgard Nonprofit Leader of the Year 2019; Philanthropy NW Ambassador of the Year 2019 | LinkedIn | https://www.linkedin.com/in/kathil | secondary | 0.7 |\n\n## §11 New relationships discovered\nkathi-littmann, target=gtcf, relationship=ceo, weight=5, note=\"https://www.gtcf.org/news-reports/gtcf-marks-45-years-and-looks-to-its-next-chapter\" (already in graph)\nkathi-littmann, target=plu, relationship=regent, weight=3, note=\"https://www.plu.edu/strategic-planning/2020/05/16/spring-meeting-of-the-board-of-regents\" (NEW — PLU regent seat not yet encoded in v2 graph)\n\n## §12 Assessment\n**Confidence:** High — GTCF tenure and assets are confirmed by GTCF's own primary source. PLU regent seat is confirmed by PLU's blog and the PLU Form 990. Career background is backed by LinkedIn and the GTCF news release.\n**Verdict:** Littmann runs a $207M community foundation that decides which nonprofits get funded. She shapes who GTCF partners with and what equity frameworks Pierce County philanthropy adopts. She is institutionally important because GTCF touches \"everything\" in Pierce County's nonprofit world, in her own words. Her PLU regent seat and former Gates Foundation officer status give her reach into national philanthropy. Her power is real but bounded by the foundation board's oversight.\n**Defense counter-argument:** A defense could argue she is \"just a CEO executing board policy.\" That is true in form, but the foundation's $207M in assets and CEO-driven equity and strategy mean her agenda-setting has real weight.\n**Analysis of alternatives:** None warranted — the public record is consistent across primary sources.\n\n**Status:** ✅ researched — 2026-09-19 — tier3-chunk16-rescue."
