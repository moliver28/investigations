profile: "## 0. Why this person or group is on the map\n- **Why it is on the map:** Tacoma Weekly is one of a few print news outlets that cover Pierce County government and local politics. It is on the map for two reasons. First, it is named in Washington State Public Disclosure Commission (PDC) actions. That shows a paper-trail link to political coverage. Second, it serves as a low-cost place to publish legal notices. The City of Tacoma runs some legal ads in it. It is part of the legal-notice system in Pierce County.\n- **Other papers NOT on this map:** The News Tribune (Tacoma's daily paper, owned by McClatchy). KING 5 / KOMO / KCPQ (Seattle-Tacoma TV stations). The Stranger and Seattle Weekly (Seattle papers that sometimes cover Pierce County). Tacoma Ledger and other newer digital outlets. Gig Harbor Now (a separate small paper on the Key Peninsula).\n\n## 1. Who they are\n- **Name:** Tacoma Weekly (newspaper).\n- **Type:** A for-profit community newspaper.\n- **Owner:** Matt Nagle is the publisher and editor. The paper comes out under Pierce County Community Newspaper Group (PCCNG). PCCNG calls itself \"a locally owned and operated newspaper organization.\"\n- **Address:** P.O. Box 7185, Tacoma, WA 98417.\n- **History:** Started in 1987 as the Tacoma Monthly. Renamed Tacoma Weekly in 1994. Has used broadsheet format since 2001.\n- **Old owner:** John Weymer was the prior publisher. Weymer had over $170,000 in court judgments against him and his business since 1995. His business paid $9,157.06 in wage-theft claims to the Washington Department of Labor and Industries (L&I) over two years. In 2019 a judge ruled Weymer owed $5,000 to the Grand Cinema for failing to deliver a paid printing job.\n\n## 3. Where their power comes from\n- **Reach (FACT):** About 10,000 copies each week. Distributed on Wednesdays to \"hundreds of businesses and public spaces in the Tacoma area.\"\n- **Legal notices (FACT):** Tacoma Weekly runs a \"Submit Legals\" portal. Governments and people can publish legal notices there. That is a quasi-official role under Washington newspaper-of-record laws.\n- **Editorial problems (FACT):** In September 2021, the Washington State Public Disclosure Commission (PDC) fined Tacoma Weekly $15,000. The PDC found the paper offered political candidates a news story or endorsement in exchange for money. The paper ran cover stories for two paying candidates under a staff member's byline without saying they were paid ads. This kind of finding raises real questions about Tacoma Weekly's reliability as a news source.\n- **Editor and owner (FACT):** Publisher Matt Nagle is also the editor. Editorial and ownership are in one person.\n- **Domain overlap:**\n - **Media and government:** Legal notices, political coverage, and the 2021 PDC fine put the paper at the meeting point of local government, elections, and campaign-finance rules.\n - **Media and business:** A small for-profit paper. Its payroll and contracts have been in court (wage-theft claims, the Grand Cinema judgment).\n- **FACT vs INFERENCE:** The paper's reach, founding, and PDC fine are FACT. Whether Tacoma Weekly is really a \"community newspaper\" in the sense of doing solid accountability reporting is INFERENCE. It may be more of a place for legal notices and ads. The sources reviewed do not say directly.\n\n## 3. Where their power comes from\n| Indicator | Finding | Evidence (source #) |\n|-----------|---------|---------------------|\n| Who benefits | Readers (about 10,000 a week) and advertisers benefit. Legal-notice submitters benefit from a low-cost place to publish. Political advertisers benefited from cover-story placement. That last practice led to the 2021 PDC fine. | Sources 1, 2 |\n| Who sits | Matt Nagle is publisher and editor. PCCNG is the parent group. Old publisher John Weymer is no longer in that role. | Sources 1, 3 |\n| Who governs | Matt Nagle controls editorial and business calls. PCCNG is the publishing body. | Sources 1, 3 |\n| Who wins | The 2021 PDC finding shows two paying political candidates got cover-story placement that non-paying candidates did not get. Those two candidates are the documented \"winners\" of the paper's favor. | Source 1 |\n\n## 9. Who they are connected to\nGraph connections (from `evidence/29-power-graph-v2.json`):\n\n| Connected entity | Relationship | Weight |\n|---|---|---|\n| Pierce County Council (`county-council`) | covers | 3 |\n\n- \ntacoma-weekly, target=wa-pdc, relationship=regulated_by, weight=2, note=\"https://en.wikipedia.org/wiki/Tacoma_Weekly\" (PDC fined the paper $15,000 in 2021 for selling news stories to candidates).\ntacoma-weekly, target=wa-lni, relationship=regulated_by, weight=1, note=\"https://en.wikipedia.org/wiki/Tacoma_Weekly\" (prior publisher paid $9,157.06 in wage-theft claims).\ntacoma-weekly, target=grand-cinema, relationship=judgment, weight=1, note=\"https://en.wikipedia.org/wiki/Tacoma_Weekly\" (2019 $5,000 judgment for failed printing contract).\ntacoma-weekly, target=pccng, relationship=owned_by, weight=2, note=\"https://www.linkedin.com/company/tacoma-weekly-newspaper\" (Pierce County Community Newspaper Group is the publisher).\n\n## 1. Who they are\n| # | Claim | Source | URL | Type (primary/secondary) | Reliability |\n|---|-------|--------|-----|--------------------------|-------------|\n| 1 | Founded 1987 as Tacoma Monthly, renamed Tacoma Weekly 1994; broadsheet since 2001; ~10,000 weekly circulation; free; Publisher/Editor Matt Nagle; P.O. Box 7185 Tacoma WA 98417; controversies: 2021 PDC $15,000 fine for selling news stories to political candidates; prior publisher John Weymer accumulated >$170K in judgments; $9,157 in wage-theft claims; 2019 $5K judgment to Grand Cinema | Wikipedia — Tacoma Weekly (citing News Tribune coverage and PDC records) | https://en.wikipedia.org/wiki/Tacoma_Weekly | secondary | 0.85 |\n| 2 | Tacoma Weekly operates a \"Legal Ads\" submission portal; describes itself as a community newspaper with civic-coverage duties | Tacoma Weekly — Legal Ads / SubmitLegals page | https://tacomaweekly.com/SubmitLegals | primary | 0.90 |\n| 3 | Tacoma Weekly is published by Pierce County Community Newspaper Group (PCCNG), described as \"a locally owned and operated newspaper organization\" | LinkedIn — Tacoma Weekly Newspaper company page | https://www.linkedin.com/company/tacoma-weekly-newspaper | primary | 0.75 |\n| 4 | Tacoma Weekly self-description: \"The people of our city are the true owners of the Tacoma Weekly … They bring us the story ideas and leads, businesses owners …\" | Tacoma Weekly — Contact Us page | https://tacomaweekly.com/ContactUs | primary | 0.85 |\n\n## 1. Who they are\n- **Verdict:** Tacoma Weekly is a free weekly community paper with about 10,000 readers a week. It has used broadsheet format since 2001. Matt Nagle is the publisher under the Pierce County Community Newspaper Group (PCCNG). Its real power is (a) a low-cost place for legal notices, and (b) a place where local advertisers and political candidates can buy favorable coverage. The second use was flagged in a 2021 Washington State Public Disclosure Commission action. The PDC fined the paper $15,000 for offering news-story placement to paying candidates without saying so. The paper is on the Pierce County power map not because of a big audience (10,000 is modest) but because legal notices and political access are places where the paper has real say.\n- **Conflicts-of-interest flags:** The 2021 PDC finding shows a pattern of selling news coverage to political candidates without disclosure. Editorial and revenue were mixed on purpose. This is the main trust concern for any use of Tacoma Weekly as a source of civic news. On top of that, old publisher John Weymer's track record of judgments ($170K+ since 1995, including wage-theft claims and a failed printing job) is a red flag about business practices. Whether current publisher Matt Nagle has kept or fixed those practices is UNVERIFIED.\n- **Analysis of alternatives:** A defense reading would say the 2021 PDC fine was a single case settled without admitting broader wrongdoing. The paper kept publishing. Current publisher Matt Nagle is different from old publisher John Weymer. The opposing reading is that the PDC fine is a sign of a structural problem in community-newspaper business models. With no paywall and small ad budgets, the urge to monetize political coverage is built in, not a one-off. A paper whose 2021 conduct included undisclosed paid political coverage should be cross-checked with other outlets before being trusted for any contested civic fact in this investigation.\n- **Confidence:** Medium — circulation, founding, format, publisher, and PDC fine verified against Wikipedia and the paper's own website; the Wikipedia article references PDC and court records that were not directly extracted in this pass, so the PDC-fine detail is at one degree of remove from the primary record; UNVERIFIED for the specific 2021 PDC case number and any subsequent PDC actions against the paper under current ownership."
