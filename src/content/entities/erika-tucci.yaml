profile: "## §0 why this entity is on the map\nErika Tucci runs one of the largest private foundations in Pierce County, the Ben B. Cheney Foundation. She also chairs a governor's commission. Both roles give her real power over civic agenda-setting and grantmaking in the South Sound. She used to work at Tacoma Public Utilities. That gives her a bridge into the public-sector utilities world.\n\n## §1 Identity\n**FACT** Erika Tucci is the Executive Director of the Ben B. Cheney Foundation. She was appointed in November 2023. She took over from Brad Cheney, who served more than 20 years. She is the first woman to lead the foundation.\n**Source:** https://www.benbcheneyfoundation.org/board-of-directors-announces-leadership-transition (primary; reliability 0.95)\n\n**FACT** Before becoming Executive Director, Tucci served as the Foundation's Senior Program Officer. She has been in that role since 2019.\n**Source:** https://www.benbcheneyfoundation.org/board-of-directors-announces-leadership-transition (primary; reliability 0.95).\n\n**FACT** Tucci previously led community affairs at Tacoma Public Utilities. There, she started a leadership program that encouraged staff to volunteer.\n**Source:** https://www.benbcheneyfoundation.org/board-of-directors-announces-leadership-transition (primary; reliability 0.95).\n\n**FACT** During the pandemic, Tucci started the Pierce County Daily Report. It gave policymakers, nonprofit leaders, and funders coordinated information about human services.\n**Source:** https://www.benbcheneyfoundation.org/board-of-directors-announces-leadership-transition (primary; reliability 0.95).\n\n**FACT** She chairs the Governor's Serve Washington Commission.\n**Source:** https://www.benbcheneyfoundation.org/board-of-directors-announces-leadership-transition (primary; reliability 0.95).\n\n## §2 Power basis\n**FACT** Tucci directs grantmaking at the Cheney Foundation. The Foundation works in the same communities where Cheney Lumber Company once operated. Its EIN (Employer Identification Number, the IRS tax ID) is 91-6053760. It is located at 3110 Ruston Way, Suite A, Tacoma, WA 98402-5308.\n**Source:** https://fconline.foundationcenter.org/fdo-grantmaker-profile?key=CHEN001 (primary; reliability 0.85)\n\n**FACT** She served as Vice President and President of the Board at CLR (Comprehensive Life Resources). CLR is a mental-health agency with five facilities in Pierce County. It has about $30 million in revenue. She led the board through a CEO transition.\n**Source:** https://www.linkedin.com/in/erikatucci (secondary; reliability 0.7).\n\n**FACT** The Cheney Foundation is a member of the Tacoma-Pierce County Chamber (Foundation listing, 3110 Ruston Way).\n**Source:** https://business.tacomachamber.org/list/member/ben-b-cheney-foundation-12500 (primary; reliability 0.9).\n\n## §3a what they influence \n| Indicator | Evidence |\n|---|---|\n| **Who benefits** | Cheney Foundation grantees — youth, education, mental health, and community nonprofits in Pierce County. |\n| **Who sits** | Tucci sits on several nonprofit boards, including the Pierce County Comprehensive Plan to End Homelessness Advisory Group. |\n| **Who governs** | Through Foundation grantmaking priorities and her chair role on the Governor's Serve Washington Commission, Tucci shapes the civic agenda on volunteerism and human services. |\n| **Who wins** | Nonprofits with ties to Tucci and the Cheney Foundation get better funding access. The Foundation's grants go mostly to Pierce County, where Cheney Lumber once operated. |\n\n## §7 who they are connected to\nTucci is a structural bridge between three worlds: **philanthropy** (Cheney Foundation), **government advisory work** (Governor's Serve Washington Commission), and **public-sector work** (former Tacoma Public Utilities). She also connects into the Chamber network through the Foundation's membership.\n\n## §10 Sources\n| # | Claim | Source | URL | Type | Reliability |\n|---|---|---|---|---|---|\n| 1 | Executive Director, Cheney Foundation, Nov 2023 | Cheney Foundation press release | https://www.benbcheneyfoundation.org/board-of-directors-announces-leadership-transition | primary | 0.95 |\n| 2 | First female ED; Senior Program Officer since 2019 | Cheney Foundation press release | https://www.benbcheneyfoundation.org/board-of-directors-announces-leadership-transition | primary | 0.95 |\n| 3 | Tacoma Public Utilities community affairs role | Cheney Foundation press release | https://www.benbcheneyfoundation.org/board-of-directors-announces-leadership-transition | primary | 0.95 |\n| 4 | EIN 91-6053760; Tacoma HQ; family foundation | Foundation Directory Online | https://fconline.foundationcenter.org/fdo-grantmaker-profile?key=CHEN001 | primary | 0.85 |\n| 5 | Chamber member listing | Tacoma-Pierce County Chamber | https://business.tacomachamber.org/list/member/ben-b-cheney-foundation-12500 | primary | 0.9 |\n\n## §11 New relationships discovered\ntacoma-public-utilities, target=erika-tucci, relationship=employs, weight=1, note=\"https://www.benbcheneyfoundation.org/board-of-directors-announces-leadership-transition\"\nerika-tucci, target=cheney-foundation, relationship=employs, weight=1, note=\"https://www.benbcheneyfoundation.org/board-of-directors-announces-leadership-transition\"\n\n## §12 Assessment\n**Confidence:** High (multiple primary sources: foundation press release, Foundation Directory Online, Chamber listing).\n**Defense counter-argument:** A defense could argue a foundation ED is limited by board priorities. That is partly true. But the ED runs grantmaking recommendations and sets the daily agenda. That is where most policy influence lives in practice.\n**Analysis of alternatives:** The only alternative view is that her influence is overstated. But the Cheney Foundation's grantmaking scale, the Commission chair role, and her CLR board presidency suggest the opposite.\n\n**Status:** ✅ researched — 2026-09-19 — tier3-chunk11-rescue."
