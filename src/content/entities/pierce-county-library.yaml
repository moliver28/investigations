profile: "## 0. Why this person or group is on the map\n- **Why it's on the map:** Pierce County Library System is included as a junior taxing library district under state law (RCW) 27.12. It raises property taxes over a defined service area. That area covers unincorporated Pierce County plus 15 annexed cities and towns. It runs a multi-million-dollar annual budget. It serves about 680,000 residents through 20 branches. The graph edge `pierce-county-library → county-council, taxing, weight=3` shows its tie to the County Council.\n- **Neighbors NOT added to the map:** Tacoma Public Library is a separate system inside the City of Tacoma. Puyallup Public Library serves the City of Puyallup. Both are separate and excluded. The Washington State Library coordinates statewide but is outside this profile's scope.\n\n## 1. Who they are\n- **Exact legal name:** Pierce County Library System (PCLS). Formally the Pierce County Rural Library District.\n- **Entity type:** Washington junior taxing library district. A government entity under RCW 27.12 (Library Districts). It is separate from municipal libraries (Tacoma Public Library, Puyallup Public Library) and from the Pierce County government's general-purpose departments.\n- **Formed:** Established by ballot measure passed by voters in unincorporated Pierce County on November 7, 1944. Began operating January 2, 1946. Opened seven station branches in its first year.\n- **Service area:** Unincorporated Pierce County plus 15 cities and towns that have annexed for library service. Excludes the City of Tacoma (which has its own library system) and the City of Puyallup (which has its own library system).\n- **Branches:** 20 library locations. They include:\n - Administrative Center and Library, 3005 112th St. E., Tacoma / Summit-Waller area.\n - Anderson Island.\n - Bonney Lake.\n - Buckley.\n - DuPont.\n - Eatonville.\n - Fife.\n - Gig Harbor / Peninsula.\n - Graham.\n - Key Center.\n - Lakewood.\n - Milton / Edgewood.\n - Orting.\n - Parkland / Spanaway.\n - South Hill.\n - Steilacoom.\n - Summit (Tacoma).\n - Sumner.\n - Tillicum (Lakewood).\n - University Place.\nBusiest: Gig Harbor, South Hill, Lakewood, University Place, Parkland / Spanaway.\n- **Board of Trustees:** Five members. They are appointed by the Pierce County Executive (current executive: Ryan Mello). Five-year terms, with the option of up to two consecutive terms. Meetings are the second Wednesday of each month at 3:30 pm at the Administrative Center.\n- **Executive leadership:** Executive Director Gretchen Caserotti (one of five directors in PCLS history; predecessors: Marion Cromwell, Carolyn Else, Neel Parikh, Georgia Lomax).\n- **Collection:** About 1.2 million items. Circulation about 6.9 to 7.4 million items a year. 334,362 members (2016). About 2.2 million in-person visits a year (2016). Website had about 3.5 million visitors (2016).\n\n## 3. Where their power comes from\n- **Power from the law:** As a library district under RCW 27.12, PCLS can levy property taxes (subject to Washington's 1% cap, also called the levy lid). It can issue bonds with voter approval. It can sign contracts, hire staff, buy property, and provide library services inside its boundaries.\n- **Taxing power:** Property taxes are the main funding source per PCLS's own statement: \"Property taxes are the primary source of funding for the Library System.\" The 2018 levy (Levy Sustainability Fund) was approved by voters. It builds savings for long-term stability. Per the 2026 Budget Book, Washington's 1% property tax cap limits annual revenue growth. In 2025, General Fund expenses exceeded revenues. The budget had to be balanced carefully.\n- **Budget control (2026 figures):** Total budget about $31.9M (2016 reference figure from Wikipedia, citing Washington Public Library Statistical Report 2016). The 2026 budget summaries show several separate funds:\n - General Fund operating budget.\n - Capital Improvement Fund.\n - Election Fund.\n - Debt Service Fund.\n - Levy Sustainability Fund.\n - Property and Facility Fund.\nThe specific 2026 total is UNVERIFIED — budget summary PDFs show fund-level detail but the total was not added up in this pass.\n- **How it touches government:**\n - **Board picks:** The Pierce County Executive (Ryan Mello since Jan 2025) appoints all five trustees. They are subject to County Council confirmation (UNVERIFIED — confirmation rules vary by RCW).\n - **Annual budget approval:** The Board adopts the annual budget. It is subject to public hearings and final public-hearing rules per RCW 27.12.\n - **State Auditor oversight:** Subject to SAO accountability audits (UNVERIFIED — specific 2024 / 2025 SAO report not pulled).\n - **Levy lid:** Subject to Washington's 1% annual property-tax revenue growth cap (RCW 84.55). Lifting the lid requires voter approval.\n- **Where the domains overlap:**\n - **gov ↔ social:** Library services to about 680,000 residents. Summer reading programs. Children's programs. Community events.\n - **gov ↔ econ:** Big spending on books, databases, technology. Capital projects for branch upkeep. Recent or upcoming: Gig Harbor closure for maintenance Sept 14 to 26; Steilacoom closure Sept 28 to Oct 13.\n - **gov ↔ inst:** Interlocal partnerships with schools, community colleges, museums. Shared catalog systems.\n\n## 3. Where their power comes from\n| Indicator | Finding | Evidence (source #) |\n|-----------|---------|---------------------|\n| Who benefits | About 680,000 Pierce County residents outside Tacoma and Puyallup benefit from library services. That includes physical lending, digital resources, children's programs, summer reading, and community meeting space. Cardholders (334,362 as of 2016) benefit directly. Non-cardholders benefit from public programs and community space. | Sources 1, 2, 3 |\n| Who sits | A five-member Board of Trustees governs PCLS. Current roster (as of 2026): Neesha Patel (Chair, Edgewood resident, tenured math professor at SPSCC, term ends Aug 11, 2030); Ryan Wheaton (Vice-Chair, Puyallup, Chief Planning Officer at Pierce Transit, term ends Aug 13, 2029); Pam Duncan (Lakewood, CEO of Tierra Sólida Enterprises, term ends Feb 14, 2029); Pat Jenkins (Puyallup, program coordinator at Lutheran Community Services NW, term ends Mar 31, 2027); Tono Sablan (Parkland, Executive Director of LeMay Family Foundation, term ends Aug 5, 2031). Executive Director Gretchen Caserotti runs operations. | Sources 2, 3 |\n| Who governs | The Board of Trustees sets policy direction, approves budgets, adopts policies, and advocates for library services. The Pierce County Executive appoints trustees. That creates an indirect accountability link to the county executive. | Sources 2, 3 |\n| Who wins | Voters in the PCLS service area keep library services funded by their property taxes. The Pierce County Executive gains influence over library governance through trustee picks. Specific contractors (book vendors, IT providers, capital construction) win public-sector contracts. | Sources 2, 3 |\n\n## 9. Who they are connected to\n- Graph connections (from `evidence/29-power-graph-v2.json`):\n\n| Connected entity | Relationship | Weight |\n|---|---|---|\n| Pierce County Council (`county-council`) | taxing | 3 |\n\n- \npierce-county-library, target=county-council, relationship=appointed_by_executive, weight=2, note=\"https://mypcls.org/about-us/board-of-trustees\".\npierce-county-library, target=tacoma-public-library, relationship=service_area_peer, weight=2, note=\"https://en.wikipedia.org/wiki/Pierce_County_Library_System\".\npierce-county-library, target=wa-state-library, relationship=state_coordination, weight=1, note=\"https://en.wikipedia.org/wiki/Pierce_County_Library_System\".\npierce-county-library, target=pierce-transit, relationship=staff_interlock, weight=2, note=\"https://mypcls.org/about-us/board-of-trustees\" (Ryan Wheaton, Vice-Chair, is Chief Planning Officer at Pierce Transit).\n\n## 1. Who they are\n| # | Claim | Source | URL | Type (primary/secondary) | Reliability |\n|---|-------|--------|-----|--------------------------|-------------|\n| 1 | PCLS basic statistics: 20 locations, 580,835 served (2016), 334,362 members, 7.4M circulation, $31.9M budget (2016), Director Gretchen Caserotti, established 1944 ballot measure, started operating Jan 2, 1946; 75+ years | Wikipedia — Pierce County Library System | https://en.wikipedia.org/wiki/Pierce_County_Library_System | secondary | 0.90 |\n| 2 | Board of Trustees roster, terms, biographies (Neesha Patel Chair, Ryan Wheaton Vice-Chair, Pam Duncan, Pat Jenkins, Tono Sablan); appointment by Pierce County Executive; 5-year terms; monthly meetings; 680,000 service area population | Pierce County Library System — Board of Trustees page | https://mypcls.org/about-us/board-of-trustees | primary | 0.95 |\n| 3 | Trustee Application page: 5-member Board, 5-year terms, monthly meetings, advocates for library services, sets goals and directions, approves budgets, adopts policies; \"680,000 individuals residing within the Library's service area\" | Pierce County Library System — Trustee Application page | https://mypcls.org/about-us/board-of-trustees/trustee-application | primary | 0.95 |\n| 4 | 2026 Budget Book/Summaries: General Fund operating budget, Capital Improvement Fund, Election Fund, Debt Service Fund, Levy Sustainability Fund, Property and Facility Fund; 1% property tax cap limits annual revenue growth; 2025 General Fund expenses exceeded revenues; 2018 levy established Levy Sustainability Fund | Pierce County Library System — Budget page | https://mypcls.org/about-us/budget | primary | 0.90 |\n| 5 | Board agenda packet October 8, 2025 confirms: Chair Pam Duncan (in October 2025) / Vice-Chair Neesha Patel / Pat Jenkins / Abby Sloan / Ryan Wheaton; surplus disposal resolution | Pierce County Library System — October 2025 Board Packet PDF | https://mypcls.org/wp-content/uploads/2025/10/Board-Packet-20251008-1.pdf | primary | 0.95 |\n| 6 | December 10, 2025 Board Minutes confirms: Resolution 2025-20 to release portion of Levy Sustainability Funds for 2026 Budget | Pierce County Library System — December 2025 Board Minutes PDF | https://mypcls.org/wp-content/uploads/2026/02/Board-Minutes-20251210.pdf | primary | 0.90 |\n| 7 | About page: \"Property taxes are the primary source of funding for the Library System. A Board of Trustees, comprised of Pierce County citizens, oversees the Library System\"; \"Serving you since 1946\" | Pierce County Library System — About page | https://mypcls.org/about-us | primary | 0.95 |\n\n## 1. Who they are\n- **Verdict:** PCLS runs a multi-million-dollar public library district. It delivers lending, programming, and community-space services to about 680,000 Pierce County residents across 20 branches. Its power is mostly fiscal and service-delivery. It levies property taxes (subject to the 1% cap). It adopts annual budgets. It runs a regional library system. The five-member Board of Trustees — appointed by the Pierce County Executive — sets policy direction. PCLS is limited by Washington's property-tax cap (RCW 84.55). It is also limited by voter approval rules for levy lid lifts and bonds. In 2025, General Fund expenses exceeded revenues, creating fiscal pressure. The 2018 Levy Sustainability Fund was set up to manage that constraint.\n- **Conflicts of interest:** Several Board members have direct professional ties to Pierce County or its affiliated groups. Ryan Wheaton is the Chief Planning Officer at Pierce Transit (a separate Pierce County agency). Pam Duncan chairs the Tacoma-Pierce County Affordable Housing Consortium. She chairs the Washington State Community Action Partnership. She also sits on the Washington Low-Income Housing Alliance. Tono Sablan sits on the Greater Tacoma Community Foundation Board. These cross-board memberships create alignment of interests in funding and policy choices. No specific conflict has been alleged. Trustee picks by the County Executive (Ryan Mello since Jan 2025) create political accountability but no formal confirmation gate is documented — UNVERIFIED.\n- **The other reading:** An opposing reading: PCLS is a service-delivery group with limited political power. Its choices affect library patrons but not the broader political economy of Pierce County. It is one of several library systems in the county (Tacoma Public Library, Puyallup Public Library). It competes for patron attention. The 2025 General Fund shortfall suggests fiscal pressure. That pressure may force service cuts or a levy lid lift (which would need voter approval). The trustee-appointment setup by the County Executive makes PCLS open to political capture. It also brings democratic accountability through executive elections. The board's makeup (multiple members with nonprofit and social-service backgrounds rather than business or government) tilts its policy stance toward equity, literacy, and community services.\n- **Confidence:** High. The official PCLS website, primary board packets, and Wikipedia confirm formation history, governance setup, financial scale, and current board makeup. The 2016 budget figure ($31.9M) is from the 2016 Washington Public Library Statistical Report referenced in Wikipedia. The current 2026 budget total is UNVERIFIED at the aggregate level. Fund-level detail is available in the 2026 Budget Summaries PDF."
