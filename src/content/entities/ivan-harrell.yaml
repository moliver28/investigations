profile: "## §0 why this entity is on the map\nHarrell is in the network because he is the 11th President of Tacoma Community College (TCC). TCC is one of the largest public community colleges in Pierce County. The president runs TCC's strategy, budget, and outside advocacy. Harrell also sits on the American Association of Community Colleges (AACC) board. That gives him a say in national community-college policy.\n\n## §1 Identity\n**FACT** Ivan L. Harrell II, Ph.D., is the 11th President of Tacoma Community College. He has held the role since May 2018.\n**Source:** https://www.tacomacc.edu/about/leadership/collegeadministration (primary; reliability 0.95); corroborated by Phi Theta Kappa news: https://www.tacomacc.edu/about/newsroom/_summer2025_spring2026/president-harrell-ptk-award (primary; reliability 0.95)\n\n**FACT** He was 41 when he became TCC president (per the Community College Daily profile). He grew up in Oberlin, Ohio. He was the first in his family to go to college.\n**Source:** https://www.ccdaily.com/2025/08/younger-presidents-who-have-grown-into-the-roles (secondary; reliability 0.85); https://www.tacomacc.edu/about/leadership/collegeadministration (primary; reliability 0.95).\n\n**FACT** He holds a Ph.D. from Florida State University. His dissertation title was \"Using Student Characteristics to Predict the Persistence of Community College Students Enrolled in Online Courses.\" He also has an M.Ed. from Vanderbilt University and a B.A. from Wittenberg University.\n**Source:** https://www.tacomacc.edu/about/leadership/collegeadministration (primary; reliability 0.95).\n\n**FACT** Before TCC, Harrell worked at several schools. He was at Tallahassee Community College. He was at J. Sargeant Reynolds Community College as Coordinator for Student Affairs. He was Dean of Student Affairs at Anne Arundel Community College. He was VP of Success at Lone Star College. He was EVP of Academic & Student Affairs at Georgia Piedmont Technical College.\n**Source:** https://www.tacomacc.edu/about/leadership/collegeadministration (primary; reliability 0.95).\n\n**FACT** He has been appointed to the American Association of Community Colleges (AACC) Board of Directors.\n**Source:** TCC Facebook announcement: https://www.facebook.com/TacomaCC/posts/we-are-so-proud-to-announce-that-tcc-president-dr-ivan-harrell-has-been-appointe/1310409867759923 (secondary; reliability 0.8).\n\n**FACT** In 2026 he received Phi Theta Kappa's Shirley B. Gordon Award of Distinction. That is PTK's top honor for community college presidents.\n**Source:** https://www.tacomacc.edu/about/newsroom/_summer2025_spring2026/president-harrell-ptk-award (primary; reliability 0.95).\n\n## §2 Power basis\n**FACT** As TCC President since May 2018, Harrell is the chief executive of a public community college. He runs TCC's strategy, spending, hiring of senior staff, academic programs, and outside advocacy. The Board of Trustees oversees the college.\n**Source:** https://www.tacomacc.edu/about/leadership/collegeadministration (primary; reliability 0.95)\n\n**FACT** His AACC Board of Directors seat gives him a voice in national community-college policy. Those debates affect federal financial aid and accreditation. They also affect workforce training money.\n**Source:** https://www.facebook.com/TacomaCC/posts/we-are-so-proud-to-announce-that-tcc-president-dr-ivan-harrell-has-been-appointe/1310409867759923 (secondary; reliability 0.8).\n\n## §3a what they influence \n| Indicator | Evidence |\n|---|---|\n| **Who benefits** | TCC students, faculty, and staff benefit from his strategic choices. The Pierce County workforce benefits from the college's credentials and degrees. |\n| **Who sits** | Harrell sits at the top of TCC. He also has an AACC Board of Directors seat, which is a national policy table. |\n| **Who governs** | TCC's Board of Trustees governs. Harrell runs the college day to day. Operational authority is concentrated in the president. |\n| **Who wins** | Federal funding streams and state allocations follow presidential advocacy. They are partly won or lost at the AACC table. The streams include Pell grants, WIOA, and the Perkins career and technical education act. |\n\n## §7 who they are connected to\nHarrell is a bridge between **higher education** (TCC as a workforce and transfer institution) and **national policy advocacy** (AACC). The TCC president's seat links to Tacoma's K-12 system (TCC takes district graduates), to UW Tacoma (the transfer pipeline), and to local employers (workforce credentials). His career path went from Oberlin, Ohio, to TCC. That path is national, not local. Unlike most Pierce power-network figures, his ties were built outside the region.\n\n## §10 Sources\n| # | Claim | Source | URL | Type | Reliability |\n|---|---|---|---|---|---|\n| 1 | 11th President of Tacoma Community College since May 2018 | TCC official leadership page | https://www.tacomacc.edu/about/leadership/collegeadministration | primary | 0.95 |\n| 2 | Ph.D. Florida State; M.Ed. Vanderbilt; B.A. Wittenberg | TCC official leadership page | https://www.tacomacc.edu/about/leadership/collegeadministration | primary | 0.95 |\n| 3 | 41 years old when appointed; first-generation student from Oberlin, OH | Community College Daily profile | https://www.ccdaily.com/2025/08/younger-presidents-who-have-grown-into-the-roles | secondary | 0.85 |\n| 4 | 2026 PTK Shirley B. Gordon Award of Distinction | TCC newsroom | https://www.tacomacc.edu/about/newsroom/_summer2025_spring2026/president-harrell-ptk-award | primary | 0.95 |\n| 5 | Appointed to AACC Board of Directors | TCC Facebook official post | https://www.facebook.com/TacomaCC/posts/we-are-so-proud-to-announce-that-tcc-president-dr-ivan-harrell-has-been-appointe/1310409867759923 | secondary | 0.8 |\n\n## §11 New relationships discovered\nivan-harrell, target=tcc, relationship=president, weight=5, note=\"https://www.tacomacc.edu/about/leadership/collegeadministration\" (already in graph)\nivan-harrell, target=aacc, relationship=board_member, weight=2, note=\"https://www.facebook.com/TacomaCC/posts/we-are-so-proud-to-announce-that-tcc-president-dr-ivan-harrell-has-been-appointe/1310409867759923\" (NEW, national-level board overlap)\n\n## §12 Assessment\n**Confidence:** High — TCC presidency, tenure, and education are confirmed by TCC's primary source; PTK award is corroborated by TCC's newsroom; AACC appointment is announced via TCC's official social channel.\n**Verdict:** Harrell runs the day-to-day strategy and execution of a major public community college. TCC gets state money and flows federal financial-aid dollars through. TCC also has a large workforce-training footprint. His power is real and institutionally meaningful. The AACC seat stretches his network into national community-college policy. It does not add direct local power.\n**Defense counter-argument:** A defense could say he is \"a college president among many.\" That is true in absolute terms. But TCC is a sizable institution. Its president sets training pipelines for healthcare, trades, and transfer students in Pierce County.\n**Analysis of alternatives:** None warranted — facts are public and uncontested.\n\n**Status:** ✅ researched — 2026-09-19 — tier3-chunk16-rescue."
