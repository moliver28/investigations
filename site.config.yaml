# Machine-readable site identity. The factory's ops tooling reads this file;
# humans read AGENTS.md. Keep both in sync.
site: investigations
owner: moliver28
description: Published investigations - source documents, entity profiles, and the connections between them.
author: moliver28
vertical: journalism
# Look & feel: @moliver28/theme tokens preset (tokens/presets/<id>/).
# Swap + rebuild re-skins the site (no component changes).
theme_preset: journalism-default

template:
  name: journalism
  version: 0.1.0

theme:
  name: "@moliver28/theme"
  version: 0.8.0
  distribution: vendored
  path: vendor/theme

graph:
  height: 32rem

# Config-composed pages (P6.7, OPTIONAL): declare a page as an ordered list
# of theme blocks — no markdown file, no template edit. Commented out by
# default (an absent field changes nothing); uncomment and adapt to add:
# pages:
#   about:
#     title: About this investigation
#     description: Who we are and how to reach the newsroom
#     blocks:
#       - block: fields        # a block-registry id; unknown ids fail the build
#         props:               # rendered as a definition list
#           mission: Independent tracking of the Riverside clearance.
#           contact: tips@example.org
# Runbook (shape, slug rules, config-vs-markdown precedence):
# docs/TEMPLATE-CATALOG.md in the sitefactory repo.

# Reader discovery (P9 UX F3): defaults are ALL ON — XML sitemap
# (sitemap-index.xml), RSS feed (/rss.xml), Open Graph + Twitter cards,
# JSON-LD. Set a key to false to opt that feature out at the next build;
# unknown keys fail the build loudly. The weekly link monitor
# (.github/workflows/monitor.yml) reads the deployed sitemap — opting out
# of sitemap degrades it to checking the homepage only.
discovery:
  sitemap: true
  rss: true
  opengraph: true
  jsonld: true

# CI quality budgets: Lighthouse category minimums (enforced by
# scripts/lighthouserc.cjs in the site's CI quality job). Raise with care —
# a category below its budget fails CI. Performance is 0.70, not 0.90: the
# graph page's sigma.js force layout costs ~1.7s of main-thread blocking
# under Lighthouse's mobile CPU throttling, which caps its performance
# score at ~0.72-0.77 (measured on template default content). Raise it if
# the island gets lazier, lower it per-site for heavier graphs.
performance:
  lighthouse:
    categories:
      performance: 0.70
      accessibility: 0.95
      best-practices: 0.90
      seo: 0.90

deploy:
  target: github-pages
  base: /investigations/

analytics: none

# Link-check flakiness policy (sitefactory#53) for the CI link gate
# (scripts/linkcheck-args.cjs composes it into lychee args):
# - procurement.opengov.com bot-walls every non-interactive client with 403
#   (verified 2026-11-04, browser-UA local curl) — a bot wall is not link
#   rot; 404/410/5xx still fail the gate. --accept REPLACES lychee's default
#   accepted set, hence the full range.
# - thenewstribune.com times out from datacenter IPs (verified 2026-11-04
#   from runner + local, 15+ min) — excluded outright.
# Internal links are unaffected: --root-dir serve and the dist glob are
# never configurable, and --exclude only matches external domains.
linkcheck:
  exclude_domains: [thenewstribune.com]
  accept: "200..=299,403,429"
